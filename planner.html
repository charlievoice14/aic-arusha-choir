<style>
/* Layout: inset glass sidebar + work area of rounded panels. Dark "Evergreen" (default) after the green inventory UI;
   light "Pastel planner" after the soft digital-planner look. One typeface (Plus Jakarta Sans), heavy display weights. */
@font-face{font-family:"Poppins";src:url(fonts/Poppins-400.woff2) format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"Poppins";src:url(fonts/Poppins-500.woff2) format("woff2");font-weight:500;font-style:normal;font-display:swap}
@font-face{font-family:"Poppins";src:url(fonts/Poppins-600.woff2) format("woff2");font-weight:600;font-style:normal;font-display:swap}
@font-face{font-family:"Poppins";src:url(fonts/Poppins-700.woff2) format("woff2");font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:"Poppins";src:url(fonts/Poppins-800.woff2) format("woff2");font-weight:800;font-style:normal;font-display:swap}
:root{
  --royal:#F5B942; --royal-2:#D99B22; --royal-soft:rgba(245,185,66,.16); --gold:#DDD7F8; --gold-soft:rgba(221,215,248,.16); --cyan:#8FB8F0;
  --bg:#12264A; --bg-a:#1F3D68; --bg-b:#12264A; --bg-c:#0F2140;
  --surface:#1B3459; --surface-2:#223F68; --glass:rgba(255,255,255,.075); --glass-hi:transparent; --line:rgba(255,255,255,.12); --line-2:rgba(255,255,255,.22);
  --fg:#F2F6FC; --muted:#A9BAD3; --ok:#45D3A0; --ok-soft:rgba(69,211,160,.15); --warn:#FFA95C; --warn-soft:rgba(255,169,92,.15); --bad:#FF8080; --bad-soft:rgba(255,128,128,.15); --info:#8FB8F0;
  --side-bg:rgba(18,38,74,.82); --side-fg:#F2F6FC; --side-muted:#A9BAD3; --side-on:rgba(255,255,255,.10);
  --f-display:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif; --f-body:var(--f-display); --f-mono:var(--f-display);
  --r:22px; --shadow:0 18px 40px -18px rgba(5,18,40,.55); --glow:0 18px 40px -18px rgba(5,18,40,.55);
  --s1:#45D3A0; --s2:#8FB8F0; --s3:#F5B942; --s4:#FF8080; --s5:#B9AEF5;
  --c-event:#8FB8F0; --c-practice:#45D3A0; --c-deadline:#FF8080; --c-travel:#F5B942; --c-rehearsal:#5FD0D0; --c-activity:#B9AEF5;
  --k1a:#F7D27A; --k1b:#C9922E; --k2a:#5B86C0; --k2b:#2B4F7E; --k3a:#45D3A0; --k3b:#1f8f6b; --k4a:#FF9A9A; --k4b:#C2535F; --kfg:#ffffff;
  --on-pri:#5A3B00; --ease:cubic-bezier(.2,.8,.2,1); color-scheme:dark;
}
:root.light{
  --royal:#1F3D68; --royal-2:#10284A; --royal-soft:#DCE6F3; --gold:#B07A12; --gold-soft:#FBEFD5; --cyan:#2B5F9E;
  --bg:#E6EDF6; --bg-a:#EEF3F9; --bg-b:#E6EDF6; --bg-c:#D6E0EE;
  --surface:#ffffff; --surface-2:#EEF3F9; --glass:#ffffff; --glass-hi:transparent; --line:#D3DCEA; --line-2:#C2CEE0;
  --fg:#10284A; --muted:#5A6F8E; --ok:#138A5E; --ok-soft:#DCF2E8; --warn:#B5650F; --warn-soft:#FBE9D6; --bad:#B23A3A; --bad-soft:#F8E0E0; --info:#2B5F9E;
  --side-bg:rgba(255,255,255,.9); --side-fg:#10284A; --side-muted:#8B9BB4; --side-on:#DCE6F3;
  --shadow:0 14px 34px -16px rgba(16,40,74,.25); --glow:0 10px 28px -16px rgba(16,40,74,.22);
  --s1:#138A5E; --s2:#2B5F9E; --s3:#C9922E; --s4:#B23A3A; --s5:#4B3FA0;
  --c-event:#2B5F9E; --c-practice:#138A5E; --c-deadline:#B23A3A; --c-travel:#B07A12; --c-rehearsal:#1F7F86; --c-activity:#4B3FA0;
  --k1a:#F7D27A; --k1b:#E2AE48; --k2a:#2B4F7E; --k2b:#1A3358; --k3a:#45D3A0; --k3b:#1f8f6b; --k4a:#FF9A9A; --k4b:#C2535F; --kfg:#ffffff;
  --on-pri:#ffffff; color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
input[type=file]{max-width:100%;min-width:0}
html,body{height:100%}
body{background:linear-gradient(160deg,var(--bg-a) 0%,var(--bg-b) 45%,var(--bg-c) 100%) fixed;background-color:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--royal)}
h1,h2,h3{font-family:var(--f-display);font-weight:800;letter-spacing:-.02em;text-wrap:balance;margin:0}
h1{font-size:1.6rem} h2{font-size:1.25rem} h3{font-size:1rem;font-weight:700;letter-spacing:-.01em}
.mono,.num{font-variant-numeric:tabular-nums}
.mono{letter-spacing:.01em}
.muted{color:var(--muted)} .small{font-size:.84rem}
:focus-visible{outline:2px solid var(--royal);outline-offset:2px}
.accent{color:var(--royal)}

/* ---------- shell ---------- */
.app{display:flex;min-height:100%}
.side{position:fixed;top:12px;bottom:12px;left:12px;width:var(--side-w,240px);background:var(--side-bg);backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);overflow:hidden;color:var(--side-fg);display:flex;flex-direction:column;z-index:40;transition:width .25s var(--ease),transform .3s var(--ease);padding-top:env(safe-area-inset-top,0px);padding-left:env(safe-area-inset-left,0px)}
.side .brand{display:flex;gap:10px;align-items:center;padding:18px 16px 14px}
.side .brand img,.side .brand .mark{width:40px;height:40px;border-radius:12px;object-fit:cover;flex:none;background:linear-gradient(145deg,#F7D27A,#C9922E);color:#3B2A06;display:grid;place-items:center;font-weight:800}
.side .brand .nm{font-weight:800;font-size:1rem;line-height:1.15;letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis}
.side .brand .sub{font-size:.74rem;color:var(--side-muted)}
.side nav{overflow-y:auto;flex:1;padding:6px 10px 16px;display:flex;flex-direction:column;gap:2px}
.side nav .grp{font-size:.66rem;text-transform:uppercase;letter-spacing:.12em;color:var(--side-muted);padding:12px 10px 4px;font-weight:700}
.side nav a{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:11px;color:var(--side-fg);text-decoration:none;font-size:.9rem;font-weight:500;white-space:nowrap;border:1px solid transparent;transition:background .2s,border-color .2s,color .2s}
.side nav a svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;opacity:.8}
.side nav a:hover{background:var(--side-on)}
.side nav a.on{background:var(--side-on);border-color:color-mix(in srgb,var(--royal) 45%,transparent);color:var(--royal);font-weight:700}
.side nav a.on svg{opacity:1}
.side nav a .badge{margin-left:auto;background:var(--royal);color:var(--on-pri);border-radius:10px;font-size:.68rem;padding:0 7px;font-weight:800}
.side .foot{padding:12px 16px;border-top:1px solid var(--line);font-size:.74rem;color:var(--side-muted)}
.side .collapse{background:none;border:0;color:var(--side-muted);cursor:pointer;padding:4px 0;font-size:.8rem}
body.collapsed .side{width:68px} body.collapsed .side .nm,body.collapsed .side .sub,body.collapsed .side nav a span.t,body.collapsed .side nav a .badge,body.collapsed .side .foot .t,body.collapsed .side nav .grp{display:none}
.main{flex:1;min-width:0;margin-left:calc(var(--side-w,240px) + 24px);transition:margin .25s var(--ease)}
body.collapsed .main{margin-left:92px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(14px);display:flex;align-items:center;gap:10px;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top .burger{display:none}
.top h1{font-size:1.2rem;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .who{display:flex;align-items:center;gap:8px;font-size:.84rem;color:var(--muted)}
.top .who img{width:30px;height:30px;border-radius:50%;border:2px solid var(--line-2)}
.content{padding-block:8px 70px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1440px}
.banner{padding:11px 14px;border-radius:14px;margin-bottom:14px;font-size:.88rem;border:1px solid}
.banner.warn{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 55%,transparent)}
.banner.info{background:var(--royal-soft);border-color:color-mix(in srgb,var(--royal) 45%,transparent)}
.banner.demo{background:var(--gold-soft);border-color:color-mix(in srgb,var(--gold) 55%,transparent)}
.scrim{display:none}
.bnav{display:none}
@media (max-width:900px){
  .side{transform:translateX(-115%);width:270px;top:0;bottom:0;left:0;border-radius:0 20px 20px 0} body.navopen .side{transform:none}
  body.collapsed .side{width:270px} body.collapsed .side .nm,body.collapsed .side .sub,body.collapsed .side nav a span.t,body.collapsed .side nav .grp{display:revert}
  .main,body.collapsed .main{margin-left:0}
  .top .burger{display:inline-flex}
  body.navopen .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:35;animation:fade .2s}
  .side .collapse{display:none}
  .top .who span{display:none}
  .content{padding-bottom:calc(86px + env(safe-area-inset-bottom,0px))}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:45;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));justify-content:space-around}
  .bnav a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.66rem;color:var(--muted);text-decoration:none;padding:4px 6px;border-radius:10px;min-width:56px;font-weight:600}
  .bnav a svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .bnav a.on{color:var(--royal);background:var(--royal-soft)}
  .toast-wrap{bottom:calc(80px + env(safe-area-inset-bottom,0px))!important}
}

/* ---------- motion ---------- */
@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
#mod.enter{animation:enter .38s var(--ease) both}
#mod.enter .stat,#mod.enter .kpi,#mod.enter .card{animation:enter .45s var(--ease) both}
#mod.enter .stats>*:nth-child(2),#mod.enter .kpis>*:nth-child(2){animation-delay:.03s}
#mod.enter .stats>*:nth-child(3),#mod.enter .kpis>*:nth-child(3){animation-delay:.06s}
#mod.enter .stats>*:nth-child(4),#mod.enter .kpis>*:nth-child(4){animation-delay:.09s}
#mod.enter .stats>*:nth-child(n+5){animation-delay:.12s}
.modal-bg{animation:fade .2s ease both} .modal{animation:pop .3s var(--ease) both}
.tabs button,.btn,.stat,.card,.kc,.ci,.slot{transition:background .2s,border-color .2s,color .2s,transform .2s var(--ease),box-shadow .2s}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line-2);background:var(--surface-2);border-radius:11px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:.86rem;white-space:nowrap}
.btn:hover{border-color:var(--royal);transform:translateY(-1px)}
.btn.pri{background:var(--royal);border-color:var(--royal);color:var(--on-pri);box-shadow:0 6px 18px color-mix(in srgb,var(--royal) 30%,transparent)}
.btn.pri:hover{background:var(--royal-2)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#20160a}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 55%,transparent);background:transparent}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:5px 10px;font-size:.78rem;border-radius:9px}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
.spacer{flex:1}
input[type=text],input[type=search],input[type=date],input[type=month],input[type=time],input[type=number],input[type=email],input[type=tel],input[type=url],select,textarea{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0;width:100%;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--royal);box-shadow:0 0 0 3px var(--royal-soft)}
textarea{min-height:72px;resize:vertical}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:end}
.filters label{display:flex;flex-direction:column;font-size:.72rem;color:var(--muted);gap:3px;min-width:120px;flex:0 1 160px;font-weight:600}
.filters label.grow{flex:1 1 220px}
.tabs{display:flex;gap:4px;margin-bottom:16px;overflow-x:auto;padding:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:13px;width:fit-content;max-width:100%;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:none;padding:7px 14px;cursor:pointer;color:var(--muted);font-weight:600;border-radius:9px;white-space:nowrap;font-size:.86rem}
.tabs button:hover{color:var(--fg)}
.tabs button.on{color:var(--on-pri);background:var(--royal);box-shadow:0 4px 12px color-mix(in srgb,var(--royal) 30%,transparent)}
.row > .tabs{min-width:0}
.row > select{width:auto;max-width:100%}

/* ---------- panels & stats ---------- */
.card{background:linear-gradient(180deg,var(--glass-hi),transparent 50%),var(--glass);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0;box-shadow:var(--glow)}
.card h2,.card h3{margin-bottom:10px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr))}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,175px),1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--glass);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:3px;box-shadow:var(--glow);color:var(--fg);position:relative;overflow:hidden}
.stat:hover{border-color:color-mix(in srgb,var(--royal) 60%,transparent);transform:translateY(-2px)}
.stat .v{font-size:1.5rem;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat .l{font-size:.8rem;color:var(--muted);font-weight:500}
.stat .f{font-size:.7rem;color:var(--muted)}
.stat::after{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:transparent}
.stat.warn::after{background:var(--warn)} .stat.bad::after{background:var(--bad)} .stat.ok::after{background:var(--ok)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:14px;margin-bottom:16px}
.kpi{border-radius:18px;padding:16px 18px;color:var(--kfg);cursor:pointer;border:1px solid rgba(255,255,255,.18);display:flex;flex-direction:column;gap:10px;text-align:left;box-shadow:0 12px 30px rgba(0,0,0,.25);position:relative;overflow:hidden;font:inherit}
.kpi:hover{transform:translateY(-3px)}
.kpi::before{content:"";position:absolute;right:-30px;top:-40px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.12)}
.kpi .h{display:flex;align-items:center;gap:10px;font-weight:600;font-size:.88rem}
.kpi .h i{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center;font-style:normal}
.kpi .h svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.kpi .b{display:flex;justify-content:space-between;align-items:flex-end;border-top:1px solid rgba(255,255,255,.22);padding-top:8px}
.kpi .v{font-size:1.75rem;font-weight:800;letter-spacing:-.02em;line-height:1}
.kpi .f{font-size:.72rem;opacity:.85;text-align:right}
.kpi.k1{background:linear-gradient(135deg,var(--k1a),var(--k1b));color:#3B2A06} .kpi.k2{background:linear-gradient(135deg,var(--k2a),var(--k2b))} .kpi.k3{background:linear-gradient(135deg,var(--k3a),var(--k3b))} .kpi.k4{background:linear-gradient(135deg,var(--k4a),var(--k4b))}
:root.light .kpi{border-color:transparent;box-shadow:var(--glow)}
.section-h{display:flex;align-items:baseline;gap:10px;margin:18px 0 10px}
.section-h h2{flex:1}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line-2);border-radius:var(--r)}
.bar{height:8px;background:var(--surface-2);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--royal),var(--cyan));border-radius:6px;transition:width .6s var(--ease)}
.bar.gold i{background:linear-gradient(90deg,var(--gold),color-mix(in srgb,var(--gold) 60%,var(--royal)))}
.hero-h{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.hero-h h2{font-size:clamp(1.5rem,3.2vw,2.3rem);line-height:1.08}
.hero-h h2 em{font-style:normal;color:var(--royal)}

/* ---------- tables (become cards on phones) ---------- */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--glass)}
table.t{width:100%;border-collapse:collapse;font-size:.86rem}
table.t th{text-align:left;font-weight:700;color:var(--muted);font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;background:color-mix(in srgb,var(--surface-2) 75%,transparent);padding:10px 12px;white-space:nowrap}
table.t td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:top}
table.t tr.click{cursor:pointer} table.t tr.click:hover td{background:var(--royal-soft)}
table.t td.n{font-variant-numeric:tabular-nums;text-align:right}
@media (max-width:640px){
  .tw.resp{border:0;background:none;overflow:visible}
  .tw.resp table.t thead{display:none}
  .tw.resp table.t,.tw.resp table.t tbody{display:block}
  .tw.resp table.t tr{display:block;background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:6px 12px;margin-bottom:10px}
  .tw.resp table.t td{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border:0;padding:6px 0;text-align:right}
  .tw.resp table.t td .cv{min-width:0;overflow-wrap:anywhere}
  .tw.resp table.t td:empty,.tw.resp table.t td:has(.cv:empty){display:none}
  .tw.resp table.t td::before{content:attr(data-label);color:var(--muted);font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;text-align:left;flex:none;max-width:45%}
  .tw.resp table.t td:first-child{font-size:.95rem;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:2px}
  .tw.resp table.t td[data-label=""]::before{display:none}
}

/* ---------- pills & color chips ---------- */
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 10px;font-size:.72rem;font-weight:700;background:var(--surface-2);color:var(--fg);white-space:nowrap;border:1px solid var(--line-2)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.9}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:color-mix(in srgb,var(--ok) 35%,transparent)}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 35%,transparent)}

.del-btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.modal footer .btn.danger{margin-right:auto}
/* fee payment month picker */
.fy{display:flex;gap:10px;align-items:flex-start;margin:6px 0}
.fy>b{min-width:42px;padding-top:7px;font-size:.82rem;color:var(--muted)}
.fmonths{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;flex:1}
@media (min-width:700px){.fmonths{grid-template-columns:repeat(12,minmax(0,1fr))}}
.fm{position:relative;border:1px solid var(--line-2);background:var(--surface-2);color:var(--fg);border-radius:10px;padding:7px 0;font:inherit;font-size:.8rem;font-weight:600;cursor:pointer;transition:background .15s,border-color .15s,transform .1s}
.fm:active{transform:scale(.94)}
.fm.u{border-color:color-mix(in srgb,var(--bad) 55%,transparent)}
.fm.p{border-color:color-mix(in srgb,var(--warn) 60%,transparent)}
.fm.d{border-color:color-mix(in srgb,var(--ok) 55%,transparent);color:var(--muted)}
.fm.now{box-shadow:0 0 0 1px var(--fg) inset}
.fm i{font-style:normal;font-size:.68rem;margin-left:2px}
.fm.on{background:var(--royal);border-color:var(--royal);color:var(--on-pri)}
/* permission matrix: keep the permission names readable and in view */
table.t.mx th:first-child,table.t.mx td:first-child{min-width:220px;position:sticky;left:0;z-index:1;background:var(--surface)}
/* direct marking in the "when to practise each song" grid */
.matrix.editable td.ed{cursor:pointer;transition:background-color .15s ease,box-shadow .15s ease,transform .1s ease;user-select:none;-webkit-user-select:none}
.matrix.editable td.ed:hover{box-shadow:0 0 0 2px var(--royal) inset}
.matrix.editable td.ed:active{transform:scale(.9)}
.matrix.editable td.ed:not(.on):hover::after{content:"+";color:var(--muted);font-weight:700}


/* tidy scrollbars (Windows shows thick grey ones by default) */
*{scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--fg) 22%,transparent) transparent}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--fg) 20%,transparent);border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:color-mix(in srgb,var(--fg) 35%,transparent)}
::-webkit-scrollbar-button{display:none;width:0;height:0}
/* on computers, long tab bars wrap onto a second line instead of being cut off */
@media (min-width: 901px){ .tabs{flex-wrap:wrap;overflow:visible} }

/* smooth tap feedback (no grey flash) */
*{-webkit-tap-highlight-color:transparent}
table.t tr.click td{transition:background-color .2s ease}
/* member finance page: payment entries as a tidy list */
.elist{display:flex;flex-direction:column;gap:8px}
.eitem{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:10px 12px;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:var(--glass);transition:background-color .2s,border-color .2s}
.eitem.sel{background:var(--royal-soft);border-color:color-mix(in srgb,var(--royal) 55%,transparent)}
.eitem .emain{min-width:0;display:flex;flex-direction:column;gap:4px}
.eitem .emain b{font-size:.92rem;overflow-wrap:anywhere}
.eitem .emain span{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.eitem .eamt{font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}
.eitem .eact{display:flex;gap:6px}
.eitem input[type=checkbox]{width:18px;height:18px}
@media (max-width:640px){
  /* list cards: whole card highlights smoothly when tapped */
  .tw.resp table.t tr.click{cursor:pointer;transition:background-color .2s ease,transform .12s ease}
  .tw.resp table.t tr.click:hover td,.tw.resp table.t tr.click:active td{background:transparent}
  .tw.resp table.t tr.click:active{background:var(--royal-soft);transform:scale(.985)}
  /* more compact cards */
  .tw.resp table.t tr{padding:4px 12px;margin-bottom:8px}
  .tw.resp table.t td{padding:5px 0}
  .tw.resp table.t td::before{font-size:.66rem}
  /* member page fits a phone */
  .eitem{grid-template-columns:auto 1fr auto;padding:10px}
  .eitem .eact{grid-column:2/-1;justify-content:flex-end}
  .modal .stats{grid-template-columns:1fr 1fr;gap:8px}
  .modal .stats .stat{padding:10px 12px}
  .modal .stats .stat .v{font-size:1.05rem}
  .modal .tabs{flex-wrap:wrap;width:100%}
  .modal .tabs button{flex:1 1 auto}
  .modal .kv{grid-template-columns:110px 1fr;font-size:.84rem}
  .modal footer{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .modal footer .btn{width:100%;white-space:normal}
  .modal footer .btn.pri{grid-column:1/-1;order:-1}
}

/* loading screen (dotted ring + "loading..") */
#plLoader{position:fixed;inset:0;z-index:300;display:grid;place-items:center;background:linear-gradient(160deg,var(--bg-a) 0%,var(--bg-b) 45%,var(--bg-c) 100%);transition:opacity .45s ease,visibility .45s}
#plLoader.done{opacity:0;visibility:hidden}
#plLoader .ld{display:flex;flex-direction:column;align-items:center;gap:22px}
#plLoader .ring{position:relative;width:96px;height:96px;animation:plspin 1.5s steps(16) infinite}
#plLoader .ring i{position:absolute;left:50%;top:50%;border-radius:50%;background:var(--royal);
  width:calc(4px + var(--i) * .55px);height:calc(4px + var(--i) * .55px);
  transform:translate(-50%,-50%) rotate(calc(var(--i) * 22.5deg)) translateY(-40px);opacity:calc(.25 + var(--i) * .05)}
#plLoader .txt{color:var(--fg);font:500 1.15rem/1 "Poppins",system-ui,sans-serif;letter-spacing:.06em}
#plLoader .sub{color:var(--muted);font:500 .78rem/1 "Poppins",system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;margin-top:-10px}
@keyframes plspin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){#plLoader .ring{animation-duration:4s}}

/* keep the planner solid on phones: no pinch or double-tap zoom */
html,body{touch-action:pan-x pan-y;-webkit-text-size-adjust:100%;text-size-adjust:100%}

@media (max-width:640px){
  /* card tables: first cell is the title; a lone checkbox sits beside it instead */
  .tw.resp table.t td:first-child:has(> input[type=checkbox]:only-child){border:0;padding:6px 0 0;margin:0;justify-content:flex-start}
  .tw.resp table.t td:first-child:has(> input[type=checkbox]:only-child)::before{display:none}
  .tw.resp table.t td:has(> input[type=number]) input{max-width:110px;text-align:right}
  .tw.resp table.t td{font-size:.86rem}
  .tw.resp table.t td::before{max-width:48%}
  /* Song practice planner list: compact song cards */
  #spList.tw.resp{overflow:auto;max-height:440px;padding:2px}
  .tw.resp table.sp-songs tr{display:grid;grid-template-columns:26px 1fr auto;column-gap:10px;align-items:center;padding:8px 12px}
  .tw.resp table.sp-songs td{border:0!important;padding:3px 0!important;margin:0!important}
  .tw.resp table.sp-songs td:nth-child(1){grid-column:1;grid-row:1}
  .tw.resp table.sp-songs td:nth-child(2){grid-column:2;grid-row:1;justify-content:flex-start;text-align:left;font-size:.95rem}
  .tw.resp table.sp-songs td:nth-child(3){grid-column:3;grid-row:1}
  .tw.resp table.sp-songs td:nth-child(2)::before,.tw.resp table.sp-songs td:nth-child(3)::before{display:none}
  .tw.resp table.sp-songs td:nth-child(n+4){grid-column:1/-1}
  .tw.resp table.sp-songs tr:not(.on) td:nth-child(n+4){display:none}
  .tw.resp table.sp-songs tr.sp-row.on td,.tw.resp table.sp-songs tr.sp-row:hover td{background:transparent!important}
  .tw.resp table.sp-songs tr.sp-row.on{background:var(--royal-soft);border-color:color-mix(in srgb,var(--royal) 55%,transparent)}
  /* numbered tables (#, Metric, …): the name is the card title */
  .tw.resp table.num-first td:first-child{display:none}
  .tw.resp table.num-first td:nth-child(2){font-size:.95rem;font-weight:700;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:2px;justify-content:flex-start;text-align:left}
  .tw.resp table.num-first td:nth-child(2)::before{display:none}
}

/* calendar toolbar + never let a page get wider than the phone screen */
html{overflow-x:hidden}
@supports (overflow-x:clip){html{overflow-x:clip}.main{overflow-x:clip}}
.main,#mod{max-width:100%}
.filters label > input,.filters label > select{min-width:0;max-width:100%;width:100%}
.cal-step{display:inline-flex;align-items:center;gap:8px}
.cal-step b{min-width:150px;text-align:center}
@media (max-width:640px){
  .cal-f{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .cal-f label,.cal-f label.grow{min-width:0;flex:none}
  .cal-f label:first-child{grid-column:1/-1}
  .cal-bar{flex-direction:column;align-items:stretch;gap:10px}
  .cal-vt{width:100%;display:grid;grid-template-columns:repeat(6,1fr);gap:2px;overflow:visible}
  .cal-vt button{padding:7px 2px;font-size:.76rem;min-width:0;text-align:center}
  .cal-nav{width:100%;display:grid;grid-template-columns:1fr auto auto;gap:8px}
  .cal-step{display:grid;grid-template-columns:auto 1fr auto auto;gap:6px;grid-column:1/-1;min-width:0}
  .cal-step b{min-width:0;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cal-nav > .btn{justify-self:stretch}
  .cal-nav > #cNew{grid-column:1/2}
  .cal-lg{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px}
  .cal-lg span,.cal-lg label{min-width:0}
}
@media (max-width:640px){ .wk{grid-template-columns:1fr;min-width:0} .wk .col{min-height:0} }
@media (max-width:360px){ .cal-vt{grid-template-columns:repeat(3,1fr)} .cal-lg{grid-template-columns:1fr} }

/* AAC Finance password lock */
.fin-lock{max-width:440px;margin:24px auto;text-align:center;padding:28px 22px}

.fin-lock h3{margin-bottom:6px}
.fin-lock-row{display:flex;gap:8px;margin-top:14px}
.fin-lock-row input{flex:1;min-width:0}
