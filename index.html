function sessionRate(s, members){
  const elig = members.filter(m=>memberJoinedBy(m, s.date));
  let present=0, late=0, excused=0;
  elig.forEach(m=>{ const r=(s.records||{})[m.id]; if(!r) return; if(r.status==='present') present++; else if(r.status==='late') late++; else if(r.status==='excused') excused++; });
  const absent = elig.length - present - late - excused;
  const counted = elig.length - excused;
  return { present, late, absent, excused, total: elig.length, pct: counted ? Math.round((present+late)/counted*100) : 0 };
}
function lineChartSvg(points){
  // points: [{label, pct, title}]
  const W = 320, H = 170, L = 30, R = 10, T = 12, B = 26;
  const n = points.length, iw = W-L-R, ih = H-T-B;
  const x = i => L + (n === 1 ? iw/2 : i*iw/(n-1));
  const y = v => T + ih - v/100*ih;
  const grid = [0,25,50,75,100].map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" class="rc-grid"/><text x="${L-6}" y="${y(v)+3.5}" class="rc-ax" text-anchor="end">${v}%</text>`).join('');
  const path = points.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(p.pct).toFixed(1)}`).join(' ');
  const area = n > 1 ? `${path} L${x(n-1).toFixed(1)},${y(0)} L${x(0).toFixed(1)},${y(0)} Z` : '';
  const step = Math.max(1, Math.ceil(n/5));
  const xl = points.map((p,i)=> (i % step === 0 || i === n-1) ? `<text x="${x(i)}" y="${H-8}" class="rc-ax" text-anchor="${n>1 && i===0 ? 'start' : n>1 && i===n-1 ? 'end' : 'middle'}">${p.label}</text>` : '').join('');
  const dots = points.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.pct)}" r="${reportChartIdx===i?5.5:4}" class="rc-dot ${reportChartIdx===i?'on':''}"/>`).join('');
  const hits = points.map((p,i)=>{
    const w = n === 1 ? iw : iw/(n-1);
    return `<rect x="${x(i)-w/2}" y="${T}" width="${w}" height="${ih}" fill="transparent" data-rc-idx="${i}"/>`;
  }).join('');
  let tip = '';
  if(reportChartIdx !== null && points[reportChartIdx]){
    const p = points[reportChartIdx], tx = Math.min(Math.max(x(reportChartIdx), L+60), W-R-60);
    tip = `<line x1="${x(reportChartIdx)}" x2="${x(reportChartIdx)}" y1="${T}" y2="${T+ih}" class="rc-cross"/>
      <g transform="translate(${tx},${Math.max(T+4, y(p.pct)-44)})"><rect x="-60" y="0" width="120" height="34" rx="7" class="rc-tip"/>
      <text x="0" y="14" text-anchor="middle" class="rc-tip-t">${escapeHtml(p.title.length>20 ? p.title.slice(0,19)+'…' : p.title)}</text>
      <text x="0" y="27" text-anchor="middle" class="rc-tip-v">${p.pct}% attended</text></g>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" class="rc-svg" role="img" aria-label="Attendance rate per session">
    ${grid}${area ? `<path d="${area}" class="rc-area"/>` : ''}<path d="${path}" class="rc-line"/>${dots}${xl}${tip}${hits}</svg>`;
}

function goSong(id, autoplay){
  stopSongAudio(); songViewId = id; songMenuOpen = false; songAutoPlay = !!autoplay;
  render(true); window.scrollTo(0,0);
}
function stepSong(dir, autoplay){
  const order = songListOrder(); if(!order.length) return;
  let i = order.findIndex(x=>x.id===songViewId);
  if(songShuffle && order.length > 1){ let j; do{ j = Math.floor(Math.random()*order.length); }while(j === i); i = j; }
  else i = (i + dir + order.length) % order.length;
  goSong(order[i].id, autoplay);
}
function attachSongPlayer(){
  const back = document.getElementById('np-back');

  let dragging = false;
  const paint = ()=>{
    const d = a.duration || 0, t = a.currentTime || 0;
    if(!dragging) seek.value = d ? Math.round(t/d*1000) : 0;
    seek.style.setProperty('--p', (d ? t/d*100 : 0) + '%');
    cur.textContent = fmtClock(t); left.textContent = '-' + fmtClock(Math.max(0, d - t));
  };

  play.onclick = ()=>{ if(a.paused){ a.play().catch(()=> showToast("This audio file couldn't be played.")); } else a.pause(); };
  a.addEventListener('play', icon); a.addEventListener('pause', icon);
  a.addEventListener('timeupdate', paint); a.addEventListener('loadedmetadata', paint);
  a.addEventListener('ended', ()=>{ icon(); if(songListOrder().length > 1) stepSong(1, true); });
  a.addEventListener('error', ()=>{ cur.textContent = 'Audio unavailable'; });
  seek.addEventListener('input', ()=>{ dragging = true; const d = a.duration || 0; seek.style.setProperty('--p', seek.value/10 + '%'); cur.textContent = fmtClock(seek.value/1000*d); });
  seek.addEventListener('change', ()=>{ const d = a.duration || 0; if(d) a.currentTime = seek.value/1000*d; dragging = false; });
  if(songAutoPlay){ songAutoPlay = false; a.play().catch(()=>{}); }
}

/* ---------------- MEMBERS ---------------- */
function sortMembers(list){
  const arr = list.slice();
  const joined = m => m.joinedAt ? new Date(m.joinedAt).getTime() : 0;
  if(memberSort === 'name-asc') arr.sort((a,b)=> a.name.localeCompare(b.name));
  else if(memberSort === 'name-desc') arr.sort((a,b)=> b.name.localeCompare(a.name));
  else if(memberSort === 'joined-new') arr.sort((a,b)=> joined(b) - joined(a));
  else if(memberSort === 'joined-old') arr.sort((a,b)=> joined(a) - joined(b));
  else if(memberSort === 'voice') arr.sort((a,b)=> (a.voicePart||'zzz').localeCompare(b.voicePart||'zzz') || a.name.localeCompare(b.name));
  return arr;
}

function localDateStr(d){ const z=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate()); }
function lateAfterMin(){ const v = data.settings && Number(data.settings.lateAfter); return Number.isFinite(v) && v >= 0 ? v : 30; }
function sessionStartMs(s){ return new Date(s.date + 'T' + (s.startTime || '00:00') + ':00').getTime(); }
function sessionState(s){
  if(s.closedAt) return 'closed';
  const now = Date.now(), st = sessionStartMs(s);
  if(now < st - CHECKIN_OPENS_BEFORE*60000) return 'upcoming';
  if(now > st + CHECKIN_CLOSES_AFTER*60000) return 'closed';
  return 'open';
}
function hhmm(ms){ return new Date(ms).toTimeString().slice(0,5); }
function codeFor(seed){
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; let h = 2166136261, out = '';
  for(let r=0;r<6;r++){ for(let i=0;i<seed.length;i++){ h ^= seed.charCodeAt(i) + r*31; h = Math.imul(h, 16777619) >>> 0; } out += chars[h % chars.length]; }
  return out;
}
function scheduleOccursOn(ev, dateStr){
  if(ev.date) return ev.date === dateStr;
  const d = new Date(dateStr + 'T00:00:00');
  return ev.day === DAYS[(d.getDay()+6)%7];
}
function memberJoinedBy(m, dateStr){ return !m.joinedAt || localDateStr(new Date(m.joinedAt)) <= dateStr; }

/* Creates today's session automatically when a scheduled rehearsal/service is about to start,
   and records everyone who didn't check in as absent once check-in closes. */
function ensureScheduledSessions(){
  if(!isConnected() || !loggedInMember) return false;
  let changed = false;
  const today = todayStr();
  if(isRealAdmin() && !data.codeSalt){ data.codeSalt = uid(); changed = true; }
  data.schedule.forEach(ev=>{
    if(!ev.time || !scheduleOccursOn(ev, today)) return;
    const id = 'auto_' + ev.id + '_' + today;
    if((data.removed||{})[id]) return;
    if(data.sessions.some(s=>s.id===id || (s.scheduleId===ev.id && s.date===today))) return;
    const st = new Date(today + 'T' + ev.time + ':00').getTime();
    const now = Date.now();
    if(now < st - CHECKIN_OPENS_BEFORE*60000 || now > st + CHECKIN_CLOSES_AFTER*60000) return;
    data.sessions.push({ id, date: today, scheduleId: ev.id, title: ev.title, startTime: ev.time,
      checkinCode: codeFor(id + (data.codeSalt||'')), records: {}, auto: true });
    applyExcuses(data.sessions[data.sessions.length-1]);
    changed = true;
  });
  return changed;
}
function needsFinalize(){ return data.sessions.some(s=>!s.finalized && sessionState(s) === 'closed'); }
/* Runs inside the save transaction on the freshest server data, so a phone that was asleep
   or offline can never overwrite real check-ins with "absent". */
function finalizeSessions(d){
  (d.sessions||[]).forEach(s=>{
    if(s.finalized || sessionState(s) !== 'closed') return;
    s.records = s.records || {};
    applyExcuses(s, d);
    (d.members||[]).forEach(m=>{ if(!s.records[m.id] && memberJoinedBy(m, s.date)) s.records[m.id] = { status:'absent', time:'', auto:true }; });
    s.finalized = true;
  });
}

function sessionTick(){

  const sig = data.sessions.filter(s=>s.date===todayStr()).map(s=>s.id+':'+sessionState(s)).join('|');

function resizePhoto(file){
  return new Promise((resolve, reject)=>{
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = ()=>{
      const S = 320, c = document.createElement('canvas'); c.width = S; c.height = S;
      const k = Math.max(S/img.width, S/img.height), w = img.width*k, h = img.height*k;
      c.getContext('2d').drawImage(img, (S-w)/2, (S-h)/2, w, h);
      URL.revokeObjectURL(url); resolve(c.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); reject(new Error('bad image')); };
    img.src = url;
  });
}

function normalizePhone(p){
  let d = String(p||'').replace(/[^\d+]/g,'');
  if(!d) return '';
  if(d.startsWith('+')) return d;
  if(d.startsWith('00')) return '+' + d.slice(2);
  if(d.startsWith('0')) return '+255' + d.slice(1);

    syncedDiscClaims.add('__cleaned');
    try{
      const all = await fsDb.collection('leaderClaims').get();
      all.forEach(d=>{ const v = d.data() || {}; if(!leaders.some(m=>m.authUid === d.id && m.id === v.memberId)) fsDb.collection('leaderClaims').doc(d.id).delete().catch(()=>{}); });
    }catch(e){}

      const d = await ref.get();
      if(!d.exists || d.data().memberId !== m.id) await ref.set({ memberId: m.id, grantedBy: loggedInMember.id, at: new Date().toISOString() });
      syncedDiscClaims.add(m.authUid);
    }catch(e){}
  }
}

/* =====================================================================
   v13: data safety — wipe guard, automatic daily backups, restore
   ===================================================================== */
let allowBulkDelete = false;     // set only by deliberate admin actions that remove many items at once
let backupList = [];             // [{id, at, by, counts, size}]
let backupBusy = false;
setInterval(()=>{ if(adminUnlocked) dailyBackup(); }, 30*60000);

/* Refuse any save that would silently remove lots of data (e.g. a phone with an old/empty copy). */
function guardAgainstWipe(remote, merged){
  if(allowBulkDelete) return;
  for(const k of COLLECTIONS){
    const before = (remote[k]||[]).length, after = (merged[k]||[]).length;
    const keep = new Set((merged[k]||[]).map(x=>x && x.id));
    const lost = (remote[k]||[]).filter(x=>x && x.id && !keep.has(x.id)).length;
    if((before > 0 && after === 0) || lost > 3){
      throw Object.assign(new Error('wipe-guard: ' + k + ' ' + before + '→' + after), { code: 'wipe-guard' });
    }
  }
}
async function withBulkDelete(fn){
  allowBulkDelete = true;
  try{ await fn(); } finally { allowBulkDelete = false; }
}

function dataCounts(d){
  return { members: (d.members||[]).length, sessions: (d.sessions||[]).length, songs: (d.songs||[]).length,
           events: (d.events||[]).length, schedule: (d.schedule||[]).length };
}
function dataSizeKB(d){ try{ return Math.round(JSON.stringify(d).length / 1024); }catch(e){ return 0; } }

async function loadBackupList(){
  if(!adminUnlocked || !canUseCloud()) return;
  try{
    const qs = await fsDb.collection('backups').get();
    const list = []; qs.forEach(d=>{ const v = d.data() || {}; list.push({ id: d.id, at: v.at, by: v.by, counts: v.counts || {}, size: v.size || 0 }); });
    backupList = list.sort((a,b)=> (b.id).localeCompare(a.id));
  }catch(e){}
}
async function makeBackup(manual){
  if(!adminUnlocked || !canUseCloud() || backupBusy) return false;
  if(!data.members || !data.members.length) return false;            // never back up an empty copy
  backupBusy = true;
  try{
    const now = new Date();
    const id = manual ? localDateStr(now) + '_' + now.toTimeString().slice(0,5).replace(':','') : localDateStr(now);
    const json = JSON.stringify(data);
    await fsDb.collection('backups').doc(id).set({ json, at: now.toISOString(), by: loggedInMember ? loggedInMember.name : '', counts: dataCounts(data), size: json.length });
    await loadBackupList();
    // keep one backup per day for 30 days, plus the 6 most recent extra (hourly/manual) ones
    const daily = backupList.filter(b=>!b.id.includes('_')), extra = backupList.filter(b=>b.id.includes('_'));
    for(const b of [...daily.slice(30), ...extra.slice(6)]){ try{ await fsDb.collection('backups').doc(b.id).delete(); }catch(e){} }
    await loadBackupList();
    return true;
  }catch(e){ console.warn('backup failed', e); return false; }
  finally{ backupBusy = false; }
}
/* An admin phone saves one backup per day automatically. */
async function dailyBackup(){
  if(!adminUnlocked) return;
  await loadBackupList();
  const today = localDateStr(new Date());
  const latest = backupList.reduce((m,b)=> Math.max(m, new Date(b.at).getTime() || 0), 0);
  if(!backupList.some(b=>b.id === today)) await makeBackup(false);
  else if(Date.now() - latest > 3*3600000) await makeBackup(true);     // extra copy every few hours while the app is in use
  if(currentTab === 'home' && !isEditingField()) render(true);
}
async function restoreBackup(id){
  const d = await fsDb.collection('backups').doc(id).get();
  if(!d.exists) throw new Error('missing');
  const restored = mergeSharedDefaults(JSON.parse(d.data().json));
  restored.appVersion = APP_VERSION;
  await makeBackup(true);                                            // keep a copy of what we're replacing
  await fsDb.runTransaction(async (tx)=>{ await tx.get(sharedRef); tx.set(sharedRef, restored); });
  data = clone(restored); baseData = clone(restored);
  resolveLoggedInMember(); resolveBoundMember();
}

/* =====================================================================
   v14: notifications (announcements + schedule start) · member notices
   ===================================================================== */
const NOTI_SEEN_KEY = 'choir_noti_seen_at';
const NOTI_SENT_KEY = 'choir_noti_sent';
let myNotices = [];              // discipline notices the leadership chose to show to this member
let unsubMyNotices = null;
let notiPrimed = false;          // first pass only records what already exists (no flood of old alerts)

function notiSent(){ try{ return new Set(JSON.parse(lsGet(NOTI_SENT_KEY) || '[]')); }catch(e){ return new Set(); } }
function saveNotiSent(set){ lsSet(NOTI_SENT_KEY, JSON.stringify([...set].slice(-300))); }

function buildNotifications(){
  if(!loggedInMember) return [];
  const out = [];
  (data.announcements || []).forEach(a=>{
    const at = a.postedAt ? new Date(a.postedAt).getTime() : new Date((a.date||todayStr()) + 'T08:00:00').getTime();
    out.push({ id: 'a:' + a.id, kind: 'ann', at, title: '📢 ' + (a.title || 'Announcement'), body: a.message || '', tab: 'home' });
  });
  const today = todayStr(), now = Date.now();
  (data.sessions || []).filter(s=>s.date === today).forEach(s=>{
    const st = sessionStartMs(s), opens = st - CHECKIN_OPENS_BEFORE*60000;
    if(now >= opens) out.push({ id: 's:' + s.id + ':open', kind: 'sched', at: opens, title: `🎶 ${s.title} — check-in is open`, body: `Starts at ${s.startTime}. Scan the QR code at the venue to check in.`, tab: 'mahudhurio' });
    if(now >= st && sessionState(s) !== 'closed') out.push({ id: 's:' + s.id + ':start', kind: 'sched', at: st, title: `⏰ ${s.title} is starting now`, body: `Please check in if you haven't yet. After ${lateAfterMin()} minutes you'll be marked late.`, tab: 'mahudhurio' });
  });
  const weekAgo = Date.now() - 7*86400000;
  (data.events || []).forEach(ev=>{
    if(!ev.createdAt || ev.createdAt < weekAgo || ev.createdBy === loggedInMember.id) return;
    out.push({ id: 'e:' + ev.id, kind: 'ann', at: ev.createdAt, title: '🎉 New event: ' + (ev.title || 'Choir event'), body: [ev.date, ev.time, ev.venue].filter(Boolean).join(' · '), tab: 'events' });
  });
  (Array.isArray(data.excuses) ? data.excuses : []).forEach(x=>{
    const req = x.requestedAt ? new Date(x.requestedAt).getTime() : 0, dec = x.decidedAt ? new Date(x.decidedAt).getTime() : 0;
    if(isRealAdmin() && x.status === 'pending' && req > weekAgo && x.memberId !== loggedInMember.id)
      out.push({ id: 'xr:' + x.id, kind: 'sched', at: req, title: '🙋 Ruhusa request from ' + (x.memberName || 'a member'), body: `${x.title || 'Rehearsal'}${x.date ? ' on ' + x.date : ''}${x.reason ? ': ' + x.reason : ''}`, tab: 'mahudhurio' });

      out.push({ id: 'xd:' + x.id + ':' + x.status, kind: 'sched', at: dec, title: x.status === 'approved' ? '✅ Your ruhusa was approved' : '❌ Your ruhusa was declined', body: `${x.title || 'Rehearsal'}${x.date ? ' on ' + x.date : ''}`, tab: 'mahudhurio' });

/* Show a phone notification (Android app, or Chrome / installed web app). */
function systemNotify(title, body, tag){
  if(!notifOn || pushActive()) return;
  try{
    if(window.AndroidBridge && typeof window.AndroidBridge.notify === 'function'){ window.AndroidBridge.notify(title, body || '', tag || ''); return; }
    if('Notification' in window && Notification.permission === 'granted'){
      const opts = { body: body || '', tag: tag || undefined, icon: 'icon-192.png', badge: 'icon-192.png', vibrate: [80, 40, 80] };
      if(navigator.serviceWorker && navigator.serviceWorker.getRegistration){
        navigator.serviceWorker.getRegistration().then(r=>{ if(r) r.showNotification(title, opts); else new Notification(title, opts); }).catch(()=>{ try{ new Notification(title, opts); }catch(e){} });
      } else new Notification(title, opts);
    }
  }catch(e){}
}

/* Called whenever data changes and every 30 seconds. */
function checkNotifications(){
  if(!loggedInMember) return;
  const list = buildNotifications(), sent = notiSent();
  if(!notiPrimed){
    notiPrimed = true;
    // first run on this phone: don't replay old items, except things from the last 10 minutes
    list.forEach(n=>{ if(Date.now() - n.at > 10*60000) sent.add(n.id); });
  }
  let fresh = list.filter(n=>!sent.has(n.id) && n.at <= Date.now() && Date.now() - n.at < 6*3600000);
  // never alert someone about their own announcement
  fresh = fresh.filter(n=>{
    if(n.kind !== 'ann') return true;
    const a = (data.announcements||[]).find(x=>'a:'+x.id === n.id);
    return !(a && a.byMemberId && a.byMemberId === loggedInMember.id);
  });
  list.forEach(n=>{ if(n.kind === 'ann'){ const a = (data.announcements||[]).find(x=>'a:'+x.id === n.id); if(a && a.byMemberId === loggedInMember.id) sent.add(n.id); } });
  fresh.slice(0, 3).forEach(n=>{
    sent.add(n.id);
    if(document.visibilityState === 'visible') inAppPop(n);
    systemNotify(n.title, n.body, n.id);
  });
  saveNotiSent(sent);
  updateNotifDot();
}
setInterval(checkNotifications, 30000);

/* =====================================================================
   v15: notifications when the app is closed (Firebase Cloud Messaging)
   ===================================================================== */
const PUSH_TOKEN_KEY = 'choir_push_token';
const PUSH_SIG_KEY = 'choir_push_sig';
const PUSH_AT_KEY = 'choir_push_at';
const PUSH_HINT_KEY = 'choir_push_hint_off';
const CHAT_PUSH_KEY = 'choir_chat_push_off';
function chatPushOff(){ return lsGet(CHAT_PUSH_KEY) === '1'; }
let pushToken = lsGet(PUSH_TOKEN_KEY) || '';
let pushBusy = false;

function isIOS(){ return /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); }
/* Android: our own app (old version without notifications) or an in-app browser like WhatsApp's */
function isOldChoirApk(){ return /AICChoirApp/.test(navigator.userAgent) && !(window.AndroidBridge && window.AndroidBridge.notify); }
function isAndroidInAppBrowser(){ return /Android/.test(navigator.userAgent) && /; wv\)/.test(navigator.userAgent) && !/AICChoirApp/.test(navigator.userAgent); }
function isStandalone(){ return (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true; }
function nativePush(){ return !!(window.AndroidBridge && typeof window.AndroidBridge.getPushToken === 'function'); }
async function webPushSupported(){
  if(window.ChoirDesktop) return false;   // desktop app: notifications while it is open
  try{ return !!(window.firebase && firebase.messaging && 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window && await firebase.messaging.isSupported()); }
  catch(e){ return false; }
}
/* This phone gets notifications from the server, so it doesn't need to make its own. */
function pushActive(){ return !!pushToken && notifOn && notiPermissionState() === 'granted'; }

async function registerPush(force){
  if(pushBusy || !notifOn || !loggedInMember || !canUseCloud() || !fsUid) return false;
  const sig = '|' + fsUid + '|' + loggedInMember.id;
  // already registered today on this phone for this member
  if(!force && pushToken && lsGet(PUSH_SIG_KEY) === pushToken + sig && Date.now() - Number(lsGet(PUSH_AT_KEY) || 0) < 86400000) return true;
  pushBusy = true;
  try{
    let token = '', platform = '';
    if(nativePush()){
      if(!(window.AndroidBridge.canNotify && window.AndroidBridge.canNotify())) return false;
      token = window.AndroidBridge.getPushToken() || ''; platform = 'android';
    } else if(await webPushSupported() && Notification.permission === 'granted'){
      const reg = await navigator.serviceWorker.ready;
      token = await firebase.messaging().getToken({ serviceWorkerRegistration: reg }); platform = 'web';
    }
    if(!token) return false;
    if(pushToken && pushToken !== token){ try{ await fsDb.collection('pushTokens').doc(pushToken).delete(); }catch(e){} }
    await fsDb.collection('pushTokens').doc(token).set({ token, uid: fsUid, memberId: loggedInMember.id, platform, at: Date.now(), chatOff: chatPushOff() });
    pushToken = token; lsSet(PUSH_TOKEN_KEY, token); lsSet(PUSH_SIG_KEY, token + sig); lsSet(PUSH_AT_KEY, String(Date.now()));
    if(document.querySelector('.push-hint') && !isEditingField()) render(true);
    return true;
  }catch(e){ console.warn('push register failed', e && e.message); return false; }
  finally{ pushBusy = false; }
}
async function unregisterPush(){
  const t = pushToken;
  pushToken = ''; lsSet(PUSH_TOKEN_KEY, null); lsSet(PUSH_SIG_KEY, null); lsSet(PUSH_AT_KEY, null);
  if(t && canUseCloud()){ try{ await fsDb.collection('pushTokens').doc(t).delete(); }catch(e){} }
}
/* Called by the Android app when its push token is ready or changes. */
window.onNativePushToken = function(){ lsSet(PUSH_AT_KEY, null); registerPush(true); };
/* Called by the Android app after the member answers the "allow notifications" question. */
window.onNativeNotifyPermission = function(granted){
  notifOn = !!granted; savePrefs();
  if(granted) registerPush(true);
  updateNotifDot();
  if(document.getElementById('noti-root')) openNotiPanel();
  if(currentTab === 'home' && !isEditingField()) render(true);
};
async function turnOnNotifications(){
  await askNotiPermission();
  if(nativePush()) return;                          // Android answers through onNativeNotifyPermission
  notifOn = notiPermissionState() === 'granted' || !!window.AndroidBridge;   // older Android app: asks by itself
  savePrefs();
  if(notifOn) await registerPush(true);
  updateNotifDot();
  if(currentTab === 'home' && !isEditingField()) render(true);
}

    unlockBtn.disabled = true; unlockBtn.textContent = 'Checking…';
    let ok = await claimAdmin(pass);
    if(!ok){ // no passcode stored yet (first setup): this becomes the admin passcode

    }

    else { unlockBtn.disabled = false; unlockBtn.textContent = 'Unlock'; showAlertModal('That passcode is not correct.'); }

  // profile editor

  document.querySelectorAll('[data-bapt]').forEach(b=>{

      document.querySelectorAll('[data-bapt]').forEach(x=>x.classList.toggle('active', x===b));

    };
  });
  const pfPhoto = document.getElementById('pf-photo');
  if(pfPhoto) pfPhoto.onchange = async ()=>{
    const f = pfPhoto.files && pfPhoto.files[0]; if(!f) return;
    try{ pendingPhoto = await resizePhoto(f); keepFormAndRender(); }catch(e){ showAlertModal("That picture couldn't be opened. Try another one."); }
  };
  const pfRemove = document.getElementById('pf-photo-remove');
  if(pfRemove) pfRemove.onclick = ()=>{ pendingPhoto = null; keepFormAndRender(); };
  const saveP = document.getElementById('save-profile');
  if(saveP) saveP.onclick = async ()=>{
    const m = data.members.find(x=>x.id===profileEditId); if(!m) return;
    const name = document.getElementById('pf-name').value.trim().replace(/\s+/g,' ');
    if(!name){ document.getElementById('pf-name').focus(); return; }
    if(data.members.some(x=>x.id!==m.id && normName(x.name)===normName(name))){ showAlertModal('Another member already uses that name.'); return; }
    const email = document.getElementById('pf-email') ? document.getElementById('pf-email').value.trim() : '';
    if(email && !/^\S+@\S+\.\S+$/.test(email)){ showAlertModal('Please check the email address.'); return; }
    saveP.disabled = true; saveP.textContent = 'Saving…';
    m.name = name;
    m.gender = document.getElementById('pf-gender').value;
    m.voicePart = document.getElementById('pf-voice').value;
    m.instrument = m.voicePart === 'Musician' ? document.getElementById('pf-instrument').value : '';
    const posEl = document.getElementById('pf-position');
    if(posEl){ m.position = posEl.value; m.isLeader = posEl.value !== 'Choir Member'; }
    saveData();
    let failed = false;
    try{
      if(document.getElementById('pf-phone')){
        const bapt = document.getElementById('pf-bapt').value;
        await savePrivateProfile(m.id, {
          birthDate: document.getElementById('pf-birth').value,
          phone: document.getElementById('pf-phone').value.trim(),
          email, residence: document.getElementById('pf-res').value.trim(),

        });
      }
      if(pendingPhoto !== undefined) await savePhoto(m.id, pendingPhoto);
    }catch(e){ console.error(e); failed = true; }
    pendingPhoto = undefined;
    if(failed){ saveP.disabled = false; saveP.textContent = 'Save profile'; showAlertModal("Some details couldn't be saved. Check your internet connection and try again. If it keeps failing, ask an administrator to reset your login."); return; }
    showToast('Profile saved');
    currentTab = profileReturnTab || 'home'; profileEditId = null; render();
  };

  // announcements: text members
  document.querySelectorAll('[data-text-ann]').forEach(b=>{
    b.onclick = ()=>{
      const a = data.announcements.find(x=>x.id===b.dataset.textAnn); if(!a) return;
      const nums = memberPhones();
      if(!adminUnlocked){ showAlertModal('Unlock member details in the Members tab first, so the app can see phone numbers.'); return; }
      if(!nums.length){ showAlertModal('No members have added a phone number yet.'); return; }
      window.location.href = smsLink(nums, `AIC Arusha Choir: ${a.title}\n${a.message}`);
    };
  });
  const smsAuto = document.getElementById('sms-auto-toggle');
  if(smsAuto) smsAuto.onchange = ()=>{ data.settings = { ...(data.settings||{}), smsAuto: smsAuto.checked }; saveData(); render(true); };

  // attendance settings & controls
  const lateSave = document.getElementById('late-after-save');
  if(lateSave) lateSave.onclick = ()=>{
    const v = parseInt(document.getElementById('late-after').value, 10);
    if(!(v >= 0 && v <= 240)){ showAlertModal('Enter a number of minutes between 0 and 240.'); return; }
    data.settings = { ...(data.settings||{}), lateAfter: v }; saveData(); showToast(`Late after ${v} minutes`); render(true);
  };
  const endS = document.getElementById('end-session');
  if(endS) endS.onclick = ()=>{
    const s = data.sessions.find(x=>x.id===activeSessionId); if(!s) return;
    showConfirmModal(`End check-in for "${s.title}"? Everyone who hasn't checked in will be marked absent.`, ()=>{
      s.closedAt = new Date().toISOString(); ensureScheduledSessions(); saveData(); render(true);
    });
  };
}

function renderMahudhurio(){

function sessionCounts(session){
  const recs = Object.values(session.records||{});
  const present = recs.filter(r=>r.status==='present').length;
  const late = recs.filter(r=>r.status==='late').length;
  const eligible = data.members.filter(m=>memberJoinedBy(m, session.date)).length;
  const excused = recs.filter(r=>r.status==='excused').length;
  const absent = session.finalized ? recs.filter(r=>r.status==='absent').length : Math.max(0, eligible - present - late - excused);
  return { present, late, absent, excused };
}
function nextScheduledToday(){
  const today = todayStr(), now = Date.now();
  return data.schedule
    .filter(ev=>ev.time && scheduleOccursOn(ev, today))
    .map(ev=>({ ev, st: new Date(today+'T'+ev.time+':00').getTime() }))
    .filter(x=>x.st + CHECKIN_CLOSES_AFTER*60000 > now)
    .filter(x=>!data.sessions.some(s=>s.scheduleId===x.ev.id && s.date===today))
    .sort((a,b)=>a.st-b.st)[0] || null;
}
function sessionStatusChip(s){
  const st = sessionState(s), start = sessionStartMs(s);
  if(st === 'open'){
    const lateAt = start + lateAfterMin()*60000;
    const closeAt = s.closedAt ? Date.now() : start + CHECKIN_CLOSES_AFTER*60000;
    const phase = Date.now() < lateAt ? `On time until ${hhmm(lateAt)}` : `Late check-ins until ${hhmm(closeAt)}`;
    return `<span class="live-chip"><i></i>Check-in open · ${phase}</span>`;
  }
  if(st === 'upcoming') return `<span class="live-chip wait">Opens at ${hhmm(start - CHECKIN_OPENS_BEFORE*60000)}</span>`;
  return `<span class="live-chip closed">Check-in closed</span>`;
}

function renderMemberAttendance(today, todaysSessions){
  const rows = todaysSessions.length ? todaysSessions.map(s=>{
    const rec = (s.records||{})[loggedInMember.id];
    const statusHtml = rec
      ? `<div class="stamp ${rec.status} on" style="cursor:default;">${labelFor(rec.status)}${rec.time ? ' · ' + rec.time : ''}</div>`
      : `<span style="font-size:12px;color:var(--text-soft);">Not checked in</span>`;
    return `
      <div class="list-item">
        <div style="min-width:0;"><div class="li-main">${escapeHtml(s.title)}</div><div class="li-sub">Starts ${s.startTime || '—'}</div><div style="margin-top:6px;">${sessionStatusChip(s)}</div></div>
        ${statusHtml}
      </div>`;
  }).join('') : '';

  const openSessions = todaysSessions.filter(s=>sessionState(s)==='open' && !(s.records||{})[loggedInMember.id]);
  const next = nextScheduledToday();
  let emptyMsg = '';
  if(!todaysSessions.length){
    emptyMsg = next
      ? `<div class="empty">Next: ${escapeHtml(next.ev.title)} at ${next.ev.time}.<i>Check-in opens at ${hhmm(next.st - CHECKIN_OPENS_BEFORE*60000)}.</i></div>`
      : `<div class="empty">Nothing scheduled for today.<i>Check-in appears here automatically when a rehearsal or service is about to start.</i></div>`;
  }

  const scanSection = openSessions.length ? `
    <div class="card">
      <h2>Check in</h2>
      <p class="desc">Scan the QR code shown by your leader, or type the code. Checking in more than ${lateAfterMin()} minutes after the start time is recorded as late.</p>

  return `
    ${scanMessage ? `<div class="scan-msg ${scanMessage.startsWith('✓') ? 'ok' : 'err'}" style="margin-bottom:14px;">${scanMessage}</div>` : ''}
    ${scanSection}
    <div class="card">
      <h2>Today's attendance</h2>
      ${rows || emptyMsg}
    </div>

/* ---------- song links: YouTube, Google Drive, Spotify, SoundCloud, Audiomack, direct audio ---------- */
function cleanLink(raw){
  let u = String(raw||'').trim();
  if(!u) return '';
  const m = u.match(/https?:\/\/\S+/i); if(m) u = m[0];          // pasted with extra text (e.g. from WhatsApp)
  if(!/^https?:\/\//i.test(u)) u = 'https://' + u.replace(/^\/+/, '');
  return u.replace(/[)\].,]+$/,'');
}
function mediaEmbed(raw){
  const url = cleanLink(raw);
  let u; try{ u = new URL(url); }catch(e){ return `<p class="desc" style="margin:8px 0 0;">This link doesn't look right. Edit the song to fix it.</p>`; }
  const host = u.hostname.replace(/^www\.|^m\./,'');
  const safe = escapeHtml(url);
  const open = (label)=> `<a class="btn ghost small media-open" href="${safe}" target="_blank" rel="noopener">${label}</a>`;
  const frame = (src, h, extra)=> `<div class="media-frame" style="height:${h}px;"><iframe src="${escapeHtml(src)}" loading="lazy" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen ${extra||''}></iframe></div>`;
  // YouTube
  let id = null;
  if(host === 'youtu.be') id = u.pathname.slice(1).split('/')[0];
  else if(host.endsWith('youtube.com')){
    id = u.searchParams.get('v') || (u.pathname.match(/\/(?:shorts|embed|live)\/([\w-]{6,})/)||[])[1];
  }
  if(id) return frame(`https://www.youtube-nocookie.com/embed/${id}?rel=0&playsinline=1`, 200) + open('Open in YouTube');
  // Google Drive file
  const drive = url.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:export=\w+&)?id=)([\w-]{10,})/);
  if(drive) return frame(`https://drive.google.com/file/d/${drive[1]}/preview`, 120) + open('Open in Google Drive');
  // Spotify
  const sp = url.match(/open\.spotify\.com\/(?:intl-\w+\/)?(track|album|playlist|episode)\/([A-Za-z0-9]+)/);
  if(sp) return frame(`https://open.spotify.com/embed/${sp[1]}/${sp[2]}`, sp[1]==='track' ? 152 : 232) + open('Open in Spotify');
  // SoundCloud
  if(host.endsWith('soundcloud.com')) return frame(`https://w.soundcloud.com/player/?url=${encodeURIComponent(url)}&color=%23ff7d92&visual=false`, 130) + open('Open in SoundCloud');
  // Direct audio / video files
  if(/\.(mp3|m4a|aac|wav|ogg|oga|opus|flac)(\?|#|$)/i.test(u.pathname)) return `<audio controls preload="none" src="${safe}"></audio>` + open('Download');

function attachChatListHandlers(){
  document.querySelectorAll('[data-chat-msg]').forEach(el=>{
    el.onclick = (e)=>{
      if(e.target.closest('a') || e.target.closest('[data-chat-jump]')) return;

    };
  });
  document.querySelectorAll('[data-chat-jump]').forEach(b=>{ b.onclick = (e)=>{ e.stopPropagation(); jumpToMessage(b.dataset.chatJump); }; });
  document.querySelectorAll('[data-chat-reply]').forEach(b=>{ b.onclick = ()=> startReply(b.dataset.chatReply); });
  document.querySelectorAll('[data-chat-copy]').forEach(b=>{
    b.onclick = ()=>{
      const m = chatMsgs.find(x=>x.id===b.dataset.chatCopy); if(!m) return;
      const done = ()=>{ chatActionId = null; renderChatListOnly(false); showToast('Message copied'); };
      if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(m.text).then(done).catch(()=>{ fallbackCopyText(m.text); done(); });
      else { fallbackCopyText(m.text); done(); }
    };
  });
  document.querySelectorAll('[data-chat-edit]').forEach(b=>{
    b.onclick = ()=>{
      const m = chatMsgs.find(x=>x.id===b.dataset.chatEdit); if(!m) return;
      chatEditId = m.id; chatReplyTo = null; chatActionId = null;
      renderChatListOnly(false); refreshComposeBar();
      const i = document.getElementById('chat-input'); if(i){ i.value = m.text; growChatInput(); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }
    };
  });
  document.querySelectorAll('[data-chat-del]').forEach(b=>{
    b.onclick = ()=>{
      const id = b.dataset.chatDel;
      showConfirmModal('Delete this message for everyone?', async ()=>{
        chatActionId = null;
        const el = document.getElementById('cm-' + id); if(el) el.classList.add('cm-out');
        await new Promise(r=>setTimeout(r, 260));
        try{ await fsDb.collection('chat').doc(id).delete(); }
        catch(e){ if(el) el.classList.remove('cm-out'); showAlertModal(isRealAdmin() && !adminUnlocked ? 'To delete other people\'s messages, first unlock admin access in the Members tab.' : "Couldn't delete the message. Check your internet connection."); }
      });
    };
  });
  // swipe right on a message to reply
  document.querySelectorAll('.cm-swipe').forEach(wrap=>{
    const bubble = wrap.querySelector('.cm-bubble'); if(!bubble) return;
    let x0 = null, y0 = null, dx = 0, active = false;
    wrap.addEventListener('touchstart', e=>{ x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; dx = 0; active = false; wrap.classList.remove('back'); }, { passive: true });
    wrap.addEventListener('touchmove', e=>{
      if(x0 === null) return;
      const mx = e.touches[0].clientX - x0, my = e.touches[0].clientY - y0;
      if(!active && Math.abs(mx) > 10 && Math.abs(mx) > Math.abs(my)*1.5 && mx > 0) active = true;
      if(!active) return;
      dx = Math.min(80, Math.max(0, mx));
      wrap.style.setProperty('--dx', dx + 'px');
      wrap.classList.toggle('ready', dx > 56);
    }, { passive: true });
    wrap.addEventListener('touchend', ()=>{
      if(active){
        if(dx > 56){ bubble.dataset.swiped = '1'; startReply(bubble.dataset.chatMsg); }
        wrap.classList.add('back'); wrap.style.setProperty('--dx', '0px'); wrap.classList.remove('ready');
      }
      x0 = null; active = false;
    });
  });
}

function countWeekdayOccurrences(dayName, fromDateStr, toDateExclusiveStr){
  const idx = DAYS.indexOf(dayName);
  if(idx < 0) return 0;
  let d = new Date(fromDateStr + 'T00:00:00');
  const end = new Date(toDateExclusiveStr + 'T00:00:00');
  let count = 0;
  let guard = 0;
  while(d < end && guard < 3650){
    if(((d.getDay()+6)%7) === idx) count++;
    d.setDate(d.getDate()+1);
    guard++;
  }
  return count;
}
function availableRehearsalsBefore(eventDateStr){
  const today = todayStr();
  const rehearsalItems = data.schedule.filter(s=>s.type==='mazoezi');
  return rehearsalItems.reduce((sum,s)=>{
    if(s.date){
      return sum + ((s.date >= today && s.date < eventDateStr) ? 1 : 0);
    }
    return sum + countWeekdayOccurrences(s.day, today, eventDateStr);
  }, 0);
}
function plannerResultHtml(eventId, songsToCover, sessionsPerSong){
  const ev = data.events.find(e=>e.id===eventId);
  if(!ev) return '';
  const today = todayStr();
  const daysUntil = Math.round((new Date(ev.date+'T00:00:00') - new Date(today+'T00:00:00')) / 86400000);
  if(daysUntil < 0){
    return `<p class="desc" style="margin:10px 0 0;">This event has already passed.</p>`;
  }
  const available = availableRehearsalsBefore(ev.date);
  const needed = Math.max(0, songsToCover) * Math.max(0, sessionsPerSong);
  let verdict;
  if(available === 0 && daysUntil > 0){
    verdict = `<span style="color:var(--late);font-weight:700;">No rehearsals are scheduled before this event.</span> Consider adding one in the Schedule tab.`;
  } else if(available >= needed){
    verdict = `<span style="color:var(--present);font-weight:700;">You're on pace</span> — about ${available - needed} session${available-needed===1?'':'s'} to spare.`;
  } else {
    const perSession = available > 0 ? (songsToCover / available).toFixed(1) : songsToCover;
    verdict = `<span style="color:var(--absent);font-weight:700;">You may be short by ${needed - available} session${needed-available===1?'':'s'}.</span> At this pace you'd need to cover about ${perSession} songs per rehearsal to be ready in time.`;
  }
  return `
    <div class="stat-grid" style="margin-top:12px;margin-bottom:10px;">
      <div class="stat"><div class="num">${daysUntil}</div><div class="lbl">Days to go</div></div>
      <div class="stat"><div class="num">${available}</div><div class="lbl">Rehearsals scheduled</div></div>
      <div class="stat"><div class="num">${needed}</div><div class="lbl">Sessions needed</div></div>
    </div>
    <p class="desc" style="margin:0;">${verdict}</p>
  `;
}

function showToast(msg){
  let t = document.getElementById('app-toast');
  if(!t){ t = document.createElement('div'); t.id = 'app-toast'; t.className = 'toast'; document.body.appendChild(t); }
  t.textContent = msg;
  requestAnimationFrame(()=> t.classList.add('show'));
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>{ t.classList.remove('show'); }, 2200);
}
function fallbackCopyText(text){
  try{
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showToast('Order of service copied!');
  }catch(e){ showToast('Could not copy — please copy manually.'); }
}
function copyOrderOfService(eventId){
  const ev = data.events.find(e=>e.id===eventId);
  if(!ev) return;
  const lines = [ev.title, `${fmtDate(ev.date)}${ev.time ? ' · ' + ev.time : ''}${ev.venue ? ' · ' + ev.venue : ''}`, ''];
  let curSec = null, n = 0;
  ev.songs.forEach((s)=>{
    if(eventSections(ev).length && (s.section||'') !== curSec){ curSec = s.section || ''; n = 0; const sec = eventSections(ev).find(x=>x.name===curSec); lines.push(''); lines.push(`— ${curSec || 'Other songs'}${sec && sec.time ? ' (' + sec.time + ')' : ''} —`); }
    const i = n++;
    let line = `${i+1}. ${s.title}`;
    if(s.key) line += ` (Key: ${s.key})`;
    if(s.leaders) line += ` — Led by ${s.leaders}`;
    lines.push(line);
    if(s.note) lines.push(`   Note: ${s.note}`);
  });
  const text = lines.join('\n');
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=> showToast('Order of service copied!')).catch(()=> fallbackCopyText(text));
  } else {
    fallbackCopyText(text);
  }
}

  if(!session || sessionState(session) !== 'open') return;

  try{
    qrInstance = new QRCode(box, { text: session.checkinCode, width:180, height:180, colorDark:"#1A1A1A", colorLight:"#ffffff" });
  }catch(e){ box.textContent = session.checkinCode; }

}

let barcodeDetector = null;
let scanBusy = false, lastScanAt = 0, scanWatchdog = null, scanTorch = false;

function scannerOverlayHtml(){

function qsStatus(msg, isErr){
  const el = document.getElementById('qs-status'); if(!el) return;
  el.textContent = msg; el.classList.toggle('err', !!isErr);
  const r = document.getElementById('qs-retry'); if(r) r.style.display = isErr ? '' : 'none';
}
function openScannerOverlay(){
  closeScannerOverlay();
  scannerOpen = true; scanMessage = '';
  const root = document.createElement('div'); root.id = 'qs-root'; root.innerHTML = scannerOverlayHtml();
  document.body.appendChild(root);
  document.getElementById('qs-close').onclick = ()=>{ closeScannerOverlay(); render(true); };
  document.getElementById('qs-retry').onclick = ()=> startScanner();
  document.getElementById('qs-file').onchange = (e)=>{ const f = e.target.files && e.target.files[0]; if(f) scanFromPhoto(f); e.target.value = ''; };
  const codeIn = document.getElementById('qs-code');
  document.getElementById('qs-code-btn').onclick = ()=>{ const v = codeIn.value.trim(); if(!v){ codeIn.focus(); return; } finishScan(v); };
  codeIn.addEventListener('keydown', e=>{ if(e.key === 'Enter') document.getElementById('qs-code-btn').click(); });
  document.getElementById('qs-torch').onclick = toggleTorch;
  startScanner();
}
function closeScannerOverlay(){
  stopCamera();
  scannerOpen = false;
  const r = document.getElementById('qs-root'); if(r) r.remove();
}
function stopCamera(){
  scannerActive = false;
  if(scanWatchdog){ clearTimeout(scanWatchdog); scanWatchdog = null; }
  if(scanAnimFrame){ cancelAnimationFrame(scanAnimFrame); scanAnimFrame = null; }
  if(scannerStream){ try{ scannerStream.getTracks().forEach(t=>t.stop()); }catch(e){} scannerStream = null; }
  const v = document.getElementById('scan-video'); if(v){ try{ v.pause(); }catch(e){} v.srcObject = null; }
  scanBusy = false; scanTorch = false;
}
function stopScanner(){ closeScannerOverlay(); }   // used when leaving the tab
async function startScanner(){
  stopCamera();
  const video = document.getElementById('scan-video'); if(!video) return;
  qsStatus('Starting camera…');
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    qsStatus(location.protocol !== 'https:' ? 'The camera only works on the secure (https) app link. Use "Scan from a photo" or type the code.' : "This phone can't open the live camera here. Use \"Scan from a photo\" or type the code.", true);
    return;
  }
  try{
    const tries = [
      { video: { facingMode: { ideal: 'environment' } }, audio: false },
      { video: true, audio: false }
    ];
    let lastErr = null;
    for(const c of tries){
      try{ scannerStream = await navigator.mediaDevices.getUserMedia(c); break; }
      catch(e){ lastErr = e; if(e && (e.name === 'NotAllowedError' || e.name === 'SecurityError')) break; }
    }
    if(!scannerStream) throw lastErr || new Error('no stream');
    if(!scannerOpen){ stopCamera(); return; }
    video.muted = true; video.setAttribute('playsinline', ''); video.setAttribute('muted', '');
    video.srcObject = scannerStream;
    try{ await video.play(); }catch(e){ /* autoplay can be refused; a frame may still arrive */ }
    // flashlight if the phone supports it
    try{
      const track = scannerStream.getVideoTracks()[0];
      const caps = track && track.getCapabilities ? track.getCapabilities() : {};
      document.getElementById('qs-torch').style.visibility = caps && caps.torch ? 'visible' : 'hidden';
    }catch(e){}
    barcodeDetector = null;
    if('BarcodeDetector' in window){
      try{
        const fmts = BarcodeDetector.getSupportedFormats ? await withTimeout(BarcodeDetector.getSupportedFormats(), 800) : ['qr_code'];
        if(fmts && fmts.includes('qr_code')) barcodeDetector = new BarcodeDetector({ formats: ['qr_code'] });
      }catch(e){ barcodeDetector = null; }
    }
    scannerActive = true;
    qsStatus('Point the camera at the QR code');
    scanAnimFrame = requestAnimationFrame(scanTick);
    // if no picture arrives, say so and offer a retry
    scanWatchdog = setTimeout(()=>{
      const v = document.getElementById('scan-video');
      if(scannerActive && v && (!v.videoWidth || v.readyState < 2)) qsStatus("The camera didn't start. Tap \"Try again\", or use \"Scan from a photo\".", true);
    }, 4500);
  }catch(e){
    console.warn('camera', e);
    stopCamera();
    const n = e && e.name;
    if(n === 'NotAllowedError' || n === 'SecurityError') qsStatus('Camera access is blocked. Allow the camera for this app in your phone Settings, then tap "Try again" — or use "Scan from a photo".', true);
    else if(n === 'NotFoundError' || n === 'OverconstrainedError') qsStatus('No camera found. Use "Scan from a photo" or type the code.', true);
    else if(n === 'NotReadableError' || n === 'AbortError') qsStatus('The camera is busy in another app. Close that app and tap "Try again".', true);
    else qsStatus("Couldn't start the camera. Tap \"Try again\", or use \"Scan from a photo\".", true);
  }
}
function withTimeout(p, ms){ return Promise.race([p, new Promise((_, rej)=>setTimeout(()=>rej(new Error('timeout')), ms))]); }
function decodeCanvas(canvas, ctx, src, sw, sh){
  if(typeof jsQR !== 'function') return null;
  const k = Math.min(1, 800 / Math.max(sw, sh));
  const w = Math.max(1, Math.round(sw*k)), h = Math.max(1, Math.round(sh*k));
  canvas.width = w; canvas.height = h;
  ctx.drawImage(src, 0, 0, w, h);
  const img = ctx.getImageData(0, 0, w, h);
  const r = jsQR(img.data, w, h, { inversionAttempts: 'attemptBoth' });
  return r && r.data ? r.data : null;
}
async function scanTick(){
  if(!scannerActive) return;
  const video = document.getElementById('scan-video');
  const canvas = document.getElementById('scan-canvas');
  const now = performance.now();
  if(video && canvas && video.readyState >= 2 && video.videoWidth && !scanBusy && now - lastScanAt > 150){
    lastScanAt = now; scanBusy = true;
    let text = null;
    try{
      if(barcodeDetector){
        try{ const codes = await withTimeout(barcodeDetector.detect(video), 700); if(codes && codes.length) text = codes[0].rawValue; }
        catch(e){ barcodeDetector = null; }          // broken on this phone — use the built-in reader instead
      }
      if(!text){
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        text = decodeCanvas(canvas, ctx, video, video.videoWidth, video.videoHeight);
      }
    }catch(e){ /* keep trying */ }
    scanBusy = false;
    if(text && scannerActive){ finishScan(text); return; }
  }
  if(scannerActive) scanAnimFrame = requestAnimationFrame(scanTick);
}
function scanFromPhoto(file){
  qsStatus('Reading the photo…');
  const img = new Image(); const url = URL.createObjectURL(file);
  img.onload = async ()=>{
    let text = null;
    try{
      if('BarcodeDetector' in window){
        try{ const d = new BarcodeDetector({ formats: ['qr_code'] }); const c = await withTimeout(d.detect(img), 1500); if(c && c.length) text = c[0].rawValue; }catch(e){}
      }
      if(!text){
        const canvas = document.createElement('canvas'); const ctx = canvas.getContext('2d', { willReadFrequently: true });
        text = decodeCanvas(canvas, ctx, img, img.naturalWidth, img.naturalHeight);
      }
    }catch(e){}
    URL.revokeObjectURL(url);
    if(text) finishScan(text);
    else qsStatus("No QR code found in that photo. Take it closer, with the whole code visible.", true);
  };
  img.onerror = ()=>{ URL.revokeObjectURL(url); qsStatus("That photo couldn't be opened.", true); };
  img.src = url;
}
async function toggleTorch(){
  try{
    const track = scannerStream && scannerStream.getVideoTracks()[0]; if(!track) return;
    scanTorch = !scanTorch; await track.applyConstraints({ advanced: [{ torch: scanTorch }] });
    document.getElementById('qs-torch').classList.toggle('on', scanTorch);
  }catch(e){}
}
function finishScan(raw){
  const code = (String(raw).trim().toUpperCase().match(/[A-Z0-9]{6}/) || [String(raw).trim().toUpperCase()])[0];
  if(navigator.vibrate) navigator.vibrate(80);
  closeScannerOverlay();
  processCheckinCode(code);
}

/* ---------------- Excused absences ---------------- */
function excusesList(){ return Array.isArray(data.excuses) ? data.excuses : []; }
function excuseMatches(x, s){ return (x.sessionId && x.sessionId === s.id) || (x.scheduleId && s.scheduleId === x.scheduleId && x.date === s.date); }
/* approved permission → the member is recorded as Excused (unless they came anyway) */
function applyExcuses(s, d){
  let changed = false;
  const list = d ? (Array.isArray(d.excuses) ? d.excuses : []) : excusesList();
  list.forEach(x=>{
    if(x.status !== 'approved' || !excuseMatches(x, s)) return;
    s.records = s.records || {};
    const r = s.records[x.memberId];
    if(!r || (r.status === 'absent')){ s.records[x.memberId] = { status:'excused', time:'', reason: x.reason || '', by: x.decidedBy || '' }; changed = true; }
  });
  return changed;
}
function upcomingOccurrences(days){
  const out = [], now = Date.now();
  for(let i=0;i<days;i++){
    const d = new Date(); d.setDate(d.getDate()+i); const ds = localDateStr(d);
    data.schedule.forEach(ev=>{
      if(!ev.time || !scheduleOccursOn(ev, ds)) return;
      const st = new Date(ds+'T'+ev.time+':00').getTime();
      if(st + CHECKIN_CLOSES_AFTER*60000 < now) return;
      const sess = data.sessions.find(s=>s.scheduleId===ev.id && s.date===ds);
      if(sess && sess.finalized) return;
      out.push({ key: ev.id+'|'+ds, scheduleId: ev.id, date: ds, time: ev.time, title: ev.title, st });
    });
  }
  data.sessions.filter(s=>!s.scheduleId && !s.finalized && s.date >= todayStr()).forEach(s=>{
    out.push({ key: 'S|'+s.id, sessionId: s.id, date: s.date, time: s.startTime, title: s.title, st: sessionStartMs(s) });
  });
  return out.sort((a,b)=>a.st-b.st);
}
function excuseStatusChip(x){
  return x.status === 'approved' ? '<span class="xchip ok">Approved</span>' : x.status === 'declined' ? '<span class="xchip no">Declined</span>' : '<span class="xchip wait">Waiting</span>';
}

function attachV10Handlers(){
  const os = document.getElementById('open-scanner'); if(os) os.onclick = openScannerOverlay;

    data.excuses = excusesList().concat([{ id: uid(), memberId: loggedInMember.id, memberName: loggedInMember.name, scheduleId: o.scheduleId || null, sessionId: o.sessionId || null,
      date: o.date, title: o.title, reason, status: 'pending', requestedAt: new Date().toISOString() }]);
    saveData(); render(true); showToast('Request sent to your leaders');
  };
  document.querySelectorAll('[data-ex-cancel]').forEach(b=>{ b.onclick = ()=>{ data.excuses = excusesList().filter(x=>x.id !== b.dataset.exCancel); saveData(); render(true); }; });
  const decide = (id, status)=>{
    const x = excusesList().find(e=>e.id===id); if(!x) return;
    x.status = status; x.decidedBy = loggedInMember.name; x.decidedAt = new Date().toISOString();
    if(status === 'approved') data.sessions.forEach(s=>applyExcuses(s));
    else data.sessions.forEach(s=>{ if(excuseMatches(x, s)){ const r = (s.records||{})[x.memberId]; if(r && r.status==='excused'){ if(s.finalized) s.records[x.memberId] = { status:'absent', time:'', auto:true }; else delete s.records[x.memberId]; } } });
    saveData(); render(true); showToast(status === 'approved' ? 'Approved — marked Excused' : 'Request declined');
  };
  document.querySelectorAll('[data-ex-approve]').forEach(b=>{ b.onclick = ()=> decide(b.dataset.exApprove, 'approved'); });

}

async function processCheckinCode(codeRaw){
  await reloadSharedData();
  ensureScheduledSessions();
  const code = codeRaw.trim().toUpperCase();
  const today = todayStr();
  const session = data.sessions.find(s=>s.date===today && s.checkinCode === code);
  if(!session){ scanMessage = "Code not recognized. Ask your leader for today's code."; render(true); return; }
  const state = sessionState(session);
  if(state === 'upcoming'){ scanMessage = `Check-in for ${session.title} opens at ${hhmm(sessionStartMs(session) - CHECKIN_OPENS_BEFORE*60000)}.`; render(true); return; }
  if(state === 'closed'){ scanMessage = `Check-in for ${session.title} has closed.`; render(true); return; }
  const existing = (session.records||{})[loggedInMember.id];
  if(existing && existing.status !== 'absent'){ scanMessage = `✓ You're already checked in — ${labelFor(existing.status)} at ${existing.time}`; render(true); return; }
  const diffMin = (Date.now() - sessionStartMs(session)) / 60000;
  const status = diffMin <= lateAfterMin() ? 'present' : 'late';
  session.records = session.records || {};
  session.records[loggedInMember.id] = { status, time: nowTime(), self: true };
  await saveData();
  scanMessage = `✓ Checked in to ${session.title} — ${labelFor(status)}`;
  render(true);
}

    b.onclick = ()=>{ editingScheduleId = editingScheduleId === b.dataset.editSchedule ? null : b.dataset.editSchedule; render(); };
  });
  document.querySelectorAll('[data-cancel-edit-schedule]').forEach(b=>{
    b.onclick = ()=>{ editingScheduleId = null; render(); };
  });
  const esClearDate = document.getElementById('es-clear-date');
  if(esClearDate) esClearDate.onclick = ()=>{ document.getElementById('es-date').value = ''; };
  document.querySelectorAll('[data-save-schedule]').forEach(b=>{
    b.onclick = ()=>{
      const ev = data.schedule.find(e=>e.id===b.dataset.saveSchedule);
      if(!ev) return;
      const title = document.getElementById('es-title').value.trim();
      if(!title){ return; }
      ev.type = document.getElementById('es-type').value;
      ev.title = title;
      ev.day = document.getElementById('es-day').value;
      ev.time = document.getElementById('es-time').value;
      const dateVal = document.getElementById('es-date').value;
      if(dateVal) ev.date = dateVal; else delete ev.date;
      editingScheduleId = null;
      saveData(); render();
    };
  });

  const memberSortEl = document.getElementById('member-sort');
  if(memberSortEl) memberSortEl.onchange = (e)=>{ memberSort = e.target.value; render(); };

  const addMem = document.getElementById('add-member');
  if(addMem) addMem.onclick = ()=>{
    const name = document.getElementById('mem-name').value.trim();
    if(!name){ document.getElementById('mem-name').focus(); return; }
    const position = document.getElementById('mem-position').value;
    data.members.push({
      id: uid(), name,
      gender: document.getElementById('mem-gender').value,
      voicePart: document.getElementById('mem-voice').value,
      instrument: document.getElementById('mem-voice').value === 'Musician' ? document.getElementById('mem-instrument').value : '',
      position, role: document.getElementById('mem-role').value,
      isLeader: position !== 'Choir Member',
      joinedAt: new Date().toISOString()
    });
    showAddMember = false;
    saveData(); render(true); showToast(name + ' added');
  };
  document.querySelectorAll('[data-reset-login]').forEach(b=>{
    b.onclick = ()=>{
      const m = data.members.find(x=>x.id===b.dataset.resetLogin); if(!m) return;
      showConfirmModal(`Reset ${m.name}'s login? Their PIN and registered phone will be cleared, so they can sign in again on any phone and choose a new PIN.`, ()=>{
        delete m.pinHash; delete m.deviceId; saveData(); render(true); showToast('Login reset for ' + m.name);
        if(canUseCloud()){
          fsDb.collection('profiles').doc(m.id).set({ ownerUid: null }, { merge:true }).catch(()=>{});
          if(photos[m.id]) fsDb.collection('photos').doc(m.id).set({ ownerUid: null }, { merge:true }).catch(()=>{});
        }
      });
    };
  });
  document.querySelectorAll('[data-del-member]').forEach(b=>{
    b.onclick = ()=>{
      const m = data.members.find(x=>x.id===b.dataset.delMember); if(!m) return;
      showConfirmModal(`Remove ${m.name} from the choir? This can't be undone.`, ()=>{
        data.members = data.members.filter(x=>x.id!==m.id);
        memberDetailId = null;
        saveData(); render(true); showToast(m.name + ' removed');
        if(canUseCloud()){
          fsDb.collection('profiles').doc(m.id).delete().catch(()=>{});
          fsDb.collection('photos').doc(m.id).delete().catch(()=>{});
        }
      });
    };
  });
  document.querySelectorAll('[data-toggle-role]').forEach(b=>{
    b.onclick = ()=>{
      const m = data.members.find(x=>x.id===b.dataset.toggleRole);
      if(!m) return;
      if(m.role === 'admin'){
        const adminCount = data.members.filter(x=>x.role==='admin').length;
        if(adminCount <= 1){ showAlertModal('At least one administrator must remain.'); return; }
        showConfirmModal(`Remove admin access from ${m.name}?`, ()=>{ m.role = 'member'; saveData(); render(); });
      } else {
        showConfirmModal(`Give ${m.name} administrator access?`, ()=>{ m.role = 'admin'; saveData(); render(); });
      }
    };
  });

  const startSession = document.getElementById('start-session');
  if(startSession) startSession.onclick = ()=>{
    const date = document.getElementById('sess-date').value || todayStr();
    const schedId = document.getElementById('sess-schedule').value;
    let title = document.getElementById('sess-title').value.trim();
    let startTime = document.getElementById('sess-start-time').value;
    if(!title && schedId){ const ev = data.schedule.find(e=>e.id===schedId); if(ev){ title = ev.title; if(!startTime) startTime = ev.time; } }
    if(!title){ document.getElementById('sess-title').focus(); return; }
    const s = { id: uid(), date, scheduleId: schedId || null, title, startTime: startTime || '00:00', checkinCode: genCode(), records: {} };
    data.sessions.push(s);
    activeSessionId = s.id;
    saveData(); render();
  };
  const sessSchedule = document.getElementById('sess-schedule');
  if(sessSchedule) sessSchedule.onchange = (e)=>{
    const opt = e.target.selectedOptions[0];
    const t = opt ? opt.dataset.time : '';
    if(t) document.getElementById('sess-start-time').value = t;
  };
  document.querySelectorAll('[data-open-session]').forEach(b=>{
    b.onclick = ()=>{ activeSessionId = b.dataset.openSession; render(); };
  });
  const regenCode = document.getElementById('regen-code');
  if(regenCode) regenCode.onclick = ()=>{
    const session = data.sessions.find(s=>s.id===activeSessionId);
    if(!session) return;
    session.checkinCode = genCode();
    saveData(); render();
  };
  const refreshCheckins = document.getElementById('refresh-checkins');
  if(refreshCheckins) refreshCheckins.onclick = async ()=>{ await reloadSharedData(); render(); };

  document.querySelectorAll('[data-mark]').forEach(b=>{
    b.onclick = ()=>{
      const session = data.sessions.find(s=>s.id===activeSessionId);
      if(!session) return;
      const memberId = b.dataset.mark;
      const status = b.dataset.status;
      const existing = session.records[memberId];
      if(existing && existing.status === status){ delete session.records[memberId]; saveData(); render(true); return; }
      if(status === 'excused'){
        const m = data.members.find(x=>x.id===memberId);
        reasonModal(`Mark ${escapeHtml(m ? m.name : 'member')} as excused`, (reason)=>{
          session.records[memberId] = { status:'excused', time:'', reason, by: loggedInMember.name }; saveData(); render(true);
        });
        return;
      }
      session.records[memberId] = { status, time: status==='absent' ? '' : nowTime() };
      saveData(); render(true);
    };
  });

  const openScanner = document.getElementById('open-scanner');

  const closeScanner = document.getElementById('close-scanner');
  if(closeScanner) closeScanner.onclick = ()=>{ stopScanner(); render(true); };
  const manualCheckin = document.getElementById('manual-checkin');
  if(manualCheckin) manualCheckin.onclick = ()=>{
    const val = document.getElementById('manual-code').value.trim();
    if(!val){ document.getElementById('manual-code').focus(); return; }
    processCheckinCode(val);
  };

  const addSong = document.getElementById('add-song');
  if(addSong) addSong.onclick = ()=>{
    const title = document.getElementById('song-title').value.trim();
    if(!title){ document.getElementById('song-title').focus(); return; }
    const fields = { title, category: document.getElementById('song-cat').value.trim(),
      lyrics: document.getElementById('song-lyrics').value.trim(), audioUrl: cleanLink(document.getElementById('song-audio').value) };
    const existing = editingLibSongId ? data.songs.find(x=>x.id===editingLibSongId) : null;
    if(existing){ Object.assign(existing, fields); showToast('Song updated'); }
    else data.songs.push({ id: uid(), ...fields });
    editingLibSongId = null; showSongForm = false;
    saveData(); render(true);
  };
  const cancelSongEdit = document.getElementById('cancel-song-edit');
  if(cancelSongEdit) cancelSongEdit.onclick = ()=>{ editingLibSongId = null; showSongForm = false; render(true); };
  document.querySelectorAll('[data-edit-libsong]').forEach(b=>{
    b.onclick = (e)=>{
      e.stopPropagation();
      stopSongAudio(); songViewId = null; songMenuOpen = false; showSongForm = false;
      editingLibSongId = b.dataset.editLibsong; render(true);
      const card = document.getElementById('song-form-card'); if(card) card.scrollIntoView({behavior:'smooth', block:'start'});
    };
  });
  document.querySelectorAll('[data-toggle-song]').forEach(el=>{
    el.onclick = ()=>{ const id = el.dataset.toggleSong; openSongId = openSongId === id ? null : id; render(); };
  });
  document.querySelectorAll('[data-del-song]').forEach(b=>{
    b.onclick = (e)=>{
      e.stopPropagation();
      const song = data.songs.find(s=>s.id===b.dataset.delSong); if(!song) return;
      showConfirmModal(`Delete "${song.title}" from the song library?`, ()=>{
        data.songs = data.songs.filter(s=>s.id!==song.id);
        if(editingLibSongId === song.id) editingLibSongId = null;
        if(openSongId === song.id) openSongId = null;
        if(songViewId === song.id){ stopSongAudio(); songViewId = null; songMenuOpen = false; }
        saveData(); render(true);
      });
    };
  });


  const addEvent = document.getElementById('add-event');
  if(addEvent) addEvent.onclick = ()=>{
    const title = document.getElementById('ev-title').value.trim();
    const date = document.getElementById('ev-date').value;
    if(!title || !date){ document.getElementById('ev-title').focus(); return; }
    data.events.push({
      id: uid(), title, date, createdAt: Date.now(), createdBy: loggedInMember.id,
      time: document.getElementById('ev-time').value,
      venue: document.getElementById('ev-venue').value.trim(),
      type: document.getElementById('ev-type').value,
      notes: document.getElementById('ev-notes').value.trim(),
      sections: readSections('ev') || [],
      songs: []
    });
    saveData(); render();
  };
  document.querySelectorAll('[data-toggle-event]').forEach(el=>{
    el.onclick = ()=>{ const id = el.dataset.toggleEvent; openEventId = openEventId === id ? null : id; editingEventId = null; editingSongRef = null; render(); };
  });
  document.querySelectorAll('[data-move-event]').forEach(b=>{
    b.onclick = ()=>{
      const idx = data.events.findIndex(e=>e.id===b.dataset.moveEvent);
      if(idx < 0) return;
      const swap = b.dataset.dir === 'up' ? idx - 1 : idx + 1;
      if(swap < 0 || swap >= data.events.length) return;
      [data.events[idx], data.events[swap]] = [data.events[swap], data.events[idx]];
      saveData(); render();
    };
  });
  document.querySelectorAll('[data-edit-event]').forEach(b=>{
    b.onclick = ()=>{ editingEventId = editingEventId === b.dataset.editEvent ? null : b.dataset.editEvent; render(); };
  });
  document.querySelectorAll('[data-cancel-edit-event]').forEach(b=>{
    b.onclick = ()=>{ editingEventId = null; render(); };
  });
  document.querySelectorAll('[data-save-event]').forEach(b=>{
    b.onclick = ()=>{
      const ev = data.events.find(e=>e.id===b.dataset.saveEvent);
      if(!ev) return;
      const title = document.getElementById('ee-title').value.trim();
      const date = document.getElementById('ee-date').value;
      if(!title || !date){ return; }
      ev.title = title; ev.date = date;
      ev.type = document.getElementById('ee-type').value;
      ev.time = document.getElementById('ee-time').value;
      ev.venue = document.getElementById('ee-venue').value.trim();
      ev.notes = document.getElementById('ee-notes').value.trim();
      const secs = readSections('ee'); if(secs){ ev.sections = secs; const names = secs.map(x=>x.name); ev.songs.forEach(sg=>{ if(sg.section && !names.includes(sg.section)) sg.section = ''; }); normalizeEventSongs(ev); }
      editingEventId = null;
      saveData(); render();
    };
  });
  document.querySelectorAll('[data-del-event]').forEach(b=>{
    b.onclick = ()=>{
      const ev = data.events.find(e=>e.id===b.dataset.delEvent);
      showConfirmModal(`Remove "${ev ? ev.title : 'this event'}" and its song list?`, ()=>{
        data.events = data.events.filter(e=>e.id!==b.dataset.delEvent);
        saveData(); render();
      });
    };
  });

  document.querySelectorAll('[data-add-song-to-event]').forEach(b=>{
    b.onclick = ()=>{
      const eventId = b.dataset.addSongToEvent;
      const ev = data.events.find(e=>e.id===eventId);
      if(!ev) return;
      const titleEl = document.getElementById(`ns-title-${eventId}`);
      const title = titleEl.value.trim();
      if(!title){ titleEl.focus(); return; }
      ev.songs.push({
        id: uid(), title,
        key: document.getElementById(`ns-key-${eventId}`).value.trim(),
        leaders: document.getElementById(`ns-leaders-${eventId}`).value.trim(),
        note: document.getElementById(`ns-note-${eventId}`).value.trim(),
        section: (document.getElementById(`ns-sec-${eventId}`) || {}).value || ''
      });
      normalizeEventSongs(ev);
      saveData(); render();
    };
  });
  document.querySelectorAll('[data-drag-handle]').forEach(handle=>{
    handle.addEventListener('pointerdown', (e)=>{
      e.preventDefault();
      const [eventId, songId] = handle.dataset.dragHandle.split(':');
      const ev = data.events.find(x=>x.id===eventId);
      if(!ev) return;
      const fromIndex = ev.songs.findIndex(s=>s.id===songId);
      if(fromIndex < 0) return;
      dragState = { eventId, songId, fromIndex };
      try{ handle.setPointerCapture(e.pointerId); }catch(err){ /* ignore */ }
      const row = handle.closest('.roll-row');
      if(row) row.classList.add('dragging-row');
    });
  });
  document.querySelectorAll('[data-edit-event-song]').forEach(b=>{
    b.onclick = ()=>{ editingSongRef = editingSongRef === b.dataset.editEventSong ? null : b.dataset.editEventSong; render(); };
  });
  document.querySelectorAll('[data-cancel-edit-event-song]').forEach(b=>{
    b.onclick = ()=>{ editingSongRef = null; render(); };
  });
  document.querySelectorAll('[data-save-event-song]').forEach(b=>{
    b.onclick = ()=>{
      const [eventId, songId] = b.dataset.saveEventSong.split(':');
      const ev = data.events.find(e=>e.id===eventId);
      if(!ev) return;
      const song = ev.songs.find(s=>s.id===songId);
      if(!song) return;
      const title = document.getElementById('es-title').value.trim();
      if(!title) return;
      song.title = title;
      song.key = document.getElementById('es-key').value.trim();
      song.leaders = document.getElementById('es-leaders').value.trim();
      song.note = document.getElementById('es-note').value.trim();
      const secEl = document.getElementById('es-sec'); if(secEl){ song.section = secEl.value; normalizeEventSongs(ev); }
      editingSongRef = null;
      saveData(); render();
    };
  });
  document.querySelectorAll('[data-del-event-song]').forEach(b=>{
    b.onclick = ()=>{
      const [eventId, songId] = b.dataset.delEventSong.split(':');
      const ev = data.events.find(e=>e.id===eventId);
      if(!ev) return;
      ev.songs = ev.songs.filter(s=>s.id!==songId);
      saveData(); render();
    };
  });
  document.querySelectorAll('[data-copy-order]').forEach(b=>{
    b.onclick = ()=> copyOrderOfService(b.dataset.copyOrder);
  });
  document.querySelectorAll('[data-open-planner]').forEach(b=>{
    b.onclick = ()=>{ openPlannerEventId = b.dataset.openPlanner; render(); };
  });
  document.querySelectorAll('[data-close-planner]').forEach(b=>{
    b.onclick = ()=>{ openPlannerEventId = null; render(); };
  });
  if(openPlannerEventId){
    const songsEl = document.getElementById(`plan-songs-${openPlannerEventId}`);
    const rateEl = document.getElementById(`plan-rate-${openPlannerEventId}`);
    const resultEl = document.getElementById(`plan-result-${openPlannerEventId}`);
    const recompute = ()=>{
      if(!songsEl || !rateEl || !resultEl) return;
      const songs = parseFloat(songsEl.value) || 0;
      const rate = parseFloat(rateEl.value) || 0;
      resultEl.innerHTML = plannerResultHtml(openPlannerEventId, songs, rate);
    };
    if(songsEl) songsEl.oninput = recompute;
    if(rateEl) rateEl.oninput = recompute;
  }
  document.querySelectorAll('[data-open-event-home]').forEach(el=>{
    el.onclick = ()=>{ openEventId = el.dataset.openEventHome; jumpTo('events'); };
  });
  document.querySelectorAll('[data-start-event-attendance]').forEach(b=>{
    b.onclick = ()=>{
      const ev = data.events.find(e=>e.id===b.dataset.startEventAttendance);
      if(!ev) return;
      const s = {
        id: uid(), date: ev.date, scheduleId: null, eventId: ev.id,
        title: ev.title, startTime: ev.time || '00:00', checkinCode: genCode(), records: {}
      };
      data.sessions.push(s);
      activeSessionId = s.id;
      saveData();
      jumpTo('mahudhurio');
    };
  });
  document.querySelectorAll('[data-manage-event-attendance]').forEach(b=>{
    b.onclick = ()=>{
      const session = data.sessions.find(s=>s.eventId === b.dataset.manageEventAttendance);
      if(!session) return;
      activeSessionId = session.id;
      jumpTo('mahudhurio');
    };
  });

  attachV7Handlers();
  attachV9Handlers();
  attachV10Handlers();
  attachV11Handlers();
  attachV12Handlers();
  attachV13Handlers();
  attachV14Handlers();
  attachV15Handlers();
  generateQrIfNeeded();
}

loadData();
</script>
<script>
document.addEventListener('gesturestart', e=>e.preventDefault(), {passive:false});
document.addEventListener('touchmove', e=>{ if(e.touches.length>1) e.preventDefault(); }, {passive:false});
</script>
<script>
(function(){
  const scr = document.getElementById('offline-screen');
  const btn = document.getElementById('offline-retry');
  function show(){ scr.classList.add('show'); }
  function hide(){
    if(!scr.classList.contains('show')) return;
    scr.classList.remove('show');
    // app couldn't start without internet — load it properly now
    if(typeof BACKEND !== 'undefined' && BACKEND === 'none'){ location.reload(); return; }
    if(typeof reloadSharedData === 'function') reloadSharedData();
  }
  async function check(){
    if(!navigator.onLine) return false;
    try{ await fetch('https://www.gstatic.com/generate_204', {mode:'no-cors', cache:'no-store'}); return true; }
    catch(e){ return false; }
  }
  window.addEventListener('offline', show);
  window.addEventListener('online', ()=>{ check().then(ok=>{ if(ok) hide(); }); });
  btn.onclick = async ()=>{
    btn.textContent = 'Checking…'; btn.disabled = true;
    const ok = await check();
    btn.textContent = 'Try again'; btn.disabled = false;
    if(ok) hide(); else { btn.animate([{transform:'translateX(0)'},{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'translateX(0)'}],{duration:280}); }
  };
  if(!navigator.onLine) show();
  else if(!window.firebase) check().then(ok=>{ if(!ok) show(); });
})();
</script>
<script>
if('serviceWorker' in navigator && location.protocol === 'https:'){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
</script>
</body>
