<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AIC Choir">
<meta name="theme-color" content="#12264A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>AIC Arusha Choir</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script>try{if(localStorage.getItem('aac_theme')==='light')document.documentElement.classList.add('light')}catch(e){}</script>
<style>
/* keep the app solid on phones: no zoom when typing, no double-tap zoom, no rubber-band bounce */
html,body{ -webkit-text-size-adjust:100%; text-size-adjust:100%; touch-action:manipulation; overscroll-behavior:none; }
input,textarea,select{ font-size:16px !important; }

#sync-dot{position:fixed;top:10px;right:10px;width:9px;height:9px;border-radius:50%;background:#9aa3b5;z-index:9999;box-shadow:0 0 0 2px rgba(255,255,255,.7);transition:background .3s}
#sync-dot[data-state="live"]{background:#2fbf71}
#sync-dot[data-state="saving"]{background:#f5b942}
#sync-dot[data-state="offline"]{background:#e5484d}

  @font-face{font-family:"Poppins";src:url(fonts/Poppins-400.woff2) format("woff2");font-weight:400;font-style:normal;font-display:swap}
  @font-face{font-family:"Poppins";src:url(fonts/Poppins-500.woff2) format("woff2");font-weight:500;font-style:normal;font-display:swap}
  @font-face{font-family:"Poppins";src:url(fonts/Poppins-600.woff2) format("woff2");font-weight:600;font-style:normal;font-display:swap}
  @font-face{font-family:"Poppins";src:url(fonts/Poppins-700.woff2) format("woff2");font-weight:700;font-style:normal;font-display:swap}
  @font-face{font-family:"Poppins";src:url(fonts/Poppins-800.woff2) format("woff2");font-weight:800;font-style:normal;font-display:swap}
  /* Theme shared with the AAC Planner — "Aurum" navy glass (default) and "Frost" light */
  :root{
    --f:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;
    --primary:#F5B942;
    --primary-dark:#D99B22;
    --primary-soft:rgba(245,185,66,0.16);
    --on-pri:#5A3B00;
    --bg:#12264A;
    --bg-a:#1F3D68;
    --bg-b:#12264A;
    --bg-c:#0F2140;
    --card:#1B3459;
    --card2:#223F68;
    --glass:rgba(255,255,255,.075);
    --glass2:rgba(255,255,255,.12);
    --text:#F2F6FC;
    --text-soft:#A9BAD3;
    --text-faint:#7F93B2;
    --border:rgba(255,255,255,.14);
    --gold:#F5B942;
    --gold-soft:rgba(245,185,66,0.16);
    --blue:#8FB8F0;
    --blue-soft:rgba(143,184,240,0.16);
    --purple:#DDD7F8;
    --purple-soft:rgba(221,215,248,0.16);
    --late:#FFA95C;
    --late-bg:rgba(255,169,92,0.15);
    --absent:#FF8080;
    --absent-bg:rgba(255,128,128,0.15);
    --present:#45D3A0;
    --hero-a:#34608F;
    --hero-b:#1C3963;
    --hero-tint:#F7D27A;
    --side-bg:rgba(18,38,74,.82);
    --shadow:0 18px 40px -18px rgba(5,18,40,.55);
    --glow:0 18px 40px -18px rgba(5,18,40,.55);
    --radius:22px;
    color-scheme:dark;
  }
  :root.light{
    --primary:#1F3D68;
    --primary-dark:#10284A;
    --primary-soft:#DCE6F3;
    --on-pri:#ffffff;
    --bg:#E6EDF6;
    --bg-a:#EEF3F9;
    --bg-b:#E6EDF6;
    --bg-c:#D6E0EE;
    --card:#ffffff;
    --card2:#EEF3F9;
    --glass:#ffffff;
    --glass2:#EEF3F9;
    --text:#10284A;
    --text-soft:#5A6F8E;
    --text-faint:#8B9BB4;
    --border:#D3DCEA;
    --gold:#B07A12;
    --gold-soft:#FBEFD5;
    --blue:#2B5F9E;
    --blue-soft:#DCE8F6;
    --purple:#4B3FA0;
    --purple-soft:#E7E3FA;
    --late:#B5650F;
    --late-bg:#FBE9D6;
    --absent:#B23A3A;
    --absent-bg:#F8E0E0;
    --present:#138A5E;
    --hero-a:#2B4F7E;
    --hero-b:#1A3358;
    --hero-tint:#F7D27A;
    --side-bg:rgba(255,255,255,.88);
    --shadow:0 14px 34px -16px rgba(16,40,74,.25);
    --glow:0 10px 28px -16px rgba(16,40,74,.22);
    color-scheme:light;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:var(--f);background:linear-gradient(160deg,var(--bg-a) 0%,var(--bg-b) 45%,var(--bg-c) 100%) fixed;background-color:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;}
  .phone{max-width:420px;margin:0 auto;min-height:100vh;background:transparent;position:relative;padding-bottom:82px;}
  body.logged-out .phone{padding-bottom:24px;}
  body.logged-out .search-bar{display:none;}
  body.no-search .search-bar{display:none;}
  body.logged-out nav.bottomnav{display:none;}
  body.logged-out #notif-toggle, body.logged-out #profile-btn{display:none;}

  header.appbar{background:var(--card);padding:16px 18px 12px;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5;}
  .appbar-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .appbar-loc{display:flex;align-items:center;gap:10px;min-width:0;}
  .brand-mark{width:38px;height:38px;border-radius:50%;background:var(--primary-soft);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .brand-mark svg{width:20px;height:20px;stroke:var(--primary);}
  .appbar-loc .name{font-weight:700;font-size:15px;line-height:1.2;}
  .appbar-loc .sub{font-size:12px;color:var(--text-soft);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .header-icons{display:flex;gap:8px;align-items:center;flex-shrink:0;}
  .icon-btn{width:38px;height:38px;border-radius:50%;background:var(--card2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;position:relative;transition:background .2s, border-color .2s;}
  .icon-btn svg{width:17px;height:17px;stroke:var(--text-soft);transition:stroke .2s;}
  .icon-btn.on{background:var(--primary-soft);border-color:var(--primary);}
  .icon-btn.on svg{stroke:var(--primary);}
  .icon-btn .dot{position:absolute;top:7px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--absent);border:1.5px solid var(--card);display:none;}
  .icon-btn.on .dot{display:block;background:var(--primary);}
  .search-bar{margin-top:12px;display:flex;align-items:center;gap:8px;background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:9px 12px;}
  .search-bar svg{width:16px;height:16px;stroke:var(--text-faint);flex-shrink:0;}
  .search-bar input{border:none;background:none;outline:none;font-size:13.5px;font-family:var(--f);color:var(--text);flex:1;min-width:0;}
  .search-bar input::placeholder{color:var(--text-faint);}

  main{padding:16px 18px 8px;}
  #main-inner{transition:opacity .26s ease, transform .36s cubic-bezier(.34,1.45,.64,1); opacity:1; transform:translateX(0) translateY(0) scale(1);}
  #main-inner.fade-out{opacity:0; transform:translateY(6px) scale(0.99);}
  #main-inner.slide-fwd-out{opacity:0; transform:translateX(-26px) scale(0.97);}
  #main-inner.slide-back-out{opacity:0; transform:translateX(26px) scale(0.97);}
  #main-inner.slide-fwd-in{opacity:0; transform:translateX(26px) scale(0.97);}
  #main-inner.slide-back-in{opacity:0; transform:translateX(-26px) scale(0.97);}

  h3.sec-title{font-size:15px;font-weight:700;margin:22px 0 12px;display:flex;align-items:center;justify-content:space-between;}
  h3.sec-title .see-all{font-size:12.5px;color:var(--primary);font-weight:600;cursor:pointer;}

  .banner{background:linear-gradient(135deg, var(--hero-a), var(--hero-b));border-radius:var(--radius);padding:22px 20px;color:#fff;position:relative;overflow:hidden;border:1px solid color-mix(in srgb,var(--primary) 35%,transparent);}
  .banner::after{content:"";position:absolute;right:-30px;bottom:-30px;width:130px;height:130px;border-radius:50%;border:1px solid rgba(255,255,255,0.12);}
  .banner .eyebrow{font-size:12px;color:var(--hero-tint);font-weight:600;text-transform:uppercase;letter-spacing:0.4px;}
  .banner h2{font-family:var(--f);font-size:21px;font-weight:600;margin:6px 0 12px;line-height:1.25;position:relative;z-index:1;color:#fff;}
  .banner .meta{display:flex;gap:14px;font-size:12.5px;color:rgba(255,255,255,.86);margin-bottom:16px;flex-wrap:wrap;}
  .banner .meta span{display:flex;align-items:center;gap:5px;}
  .banner .meta svg{width:14px;height:14px;stroke:var(--hero-tint);}
  .banner-btns{display:flex;gap:8px;flex-wrap:wrap;position:relative;z-index:1;}
  .bbtn{border:none;border-radius:10px;padding:10px 16px;font-size:13px;font-weight:700;cursor:pointer;font-family:var(--f);display:flex;align-items:center;gap:6px;transition:transform .15s, opacity .15s;}
  .bbtn:active{transform:scale(0.96);}
  .bbtn.solid{background:#fff;color:var(--primary-dark);}
  .bbtn.outline{background:rgba(255,255,255,0.1);color:#fff;border:1px solid rgba(255,255,255,0.35);}

  .grid-actions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;}
  .qa{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 6px 10px;text-align:center;cursor:pointer;transition:border-color .18s, transform .15s;}
  .qa:hover{border-color:var(--primary);}
  .qa:active{transform:scale(0.97);}
  .qa .qi{width:44px;height:44px;border-radius:50%;background:var(--primary-soft);display:flex;align-items:center;justify-content:center;margin:0 auto 8px;}
  .qa .qi svg{width:20px;height:20px;stroke:var(--primary);}
  .qa .ql{font-size:11px;font-weight:600;color:var(--text);line-height:1.25;}

  .stat-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:0;background:var(--card);border:1px solid var(--border);border-radius:14px;margin-top:20px;overflow:hidden;}
  .stat-strip .s{padding:14px 8px;text-align:center;border-right:1px solid var(--border);}
  .stat-strip .s:last-child{border-right:none;}
  .stat-strip .num{font-family:var(--f);font-size:20px;font-weight:600;color:var(--primary);}
  .stat-strip .lbl{font-size:10.5px;color:var(--text-soft);margin-top:2px;line-height:1.2;}

  .hscroll{display:flex;gap:12px;overflow-x:auto;padding-bottom:4px;margin:0 -18px;padding-left:18px;padding-right:18px;}
  .hscroll::-webkit-scrollbar{display:none;}
  .scard{flex:0 0 200px;background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;cursor:pointer;transition:border-color .18s, transform .15s;}
  .scard:hover{border-color:var(--primary);}
  .scard:active{transform:scale(0.98);}
  .scard-top{background:var(--primary-soft);padding:14px 14px 10px;}
  .scard-tag{font-size:10px;font-weight:700;color:var(--primary);text-transform:uppercase;letter-spacing:0.3px;}
  .scard-date{font-size:11.5px;color:var(--text-soft);margin-top:3px;}
  .scard-body{padding:12px 14px 14px;}
  .scard-title{font-weight:700;font-size:13.5px;margin-bottom:8px;}
  .scard-stats{display:flex;gap:10px;font-size:11px;color:var(--text-soft);margin-bottom:10px;}
  .scard-stats b{color:var(--text);}
  .scard-btn{width:100%;background:var(--primary);color:var(--on-pri);border:none;border-radius:8px;padding:8px;font-size:12px;font-weight:700;cursor:pointer;}

  .announce{background:var(--card);border:1px solid var(--border);border-left:3px solid var(--gold);border-radius:12px;padding:13px 14px;margin-bottom:10px;}
  .announce .a-title{font-weight:700;font-size:13.5px;margin-bottom:3px;color:var(--text);}
  .announce .a-msg{font-size:12.5px;color:var(--text-soft);line-height:1.5;}
  .announce .a-date{font-size:10.5px;color:var(--text-faint);margin-top:7px;text-transform:uppercase;letter-spacing:0.3px;}
  .announce .a-row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}


  input[type=password]{background:var(--card2);border:1px solid var(--border);color:var(--text);}
  /* ===== Auth screens (welcome / sign in / sign up) ===== */
  .auth{position:relative;min-height:calc(100vh - 140px);display:flex;flex-direction:column;padding:8px 6px 24px;}
  .auth-deco{position:absolute;inset:0;pointer-events:none;overflow:hidden;}
  .auth-deco svg{position:absolute;width:100%;height:100%;}
  .auth-deco path{fill:none;stroke:var(--border);stroke-width:1.4;stroke-dasharray:5 7;}
  .welcome-hero{position:relative;height:300px;display:flex;align-items:center;justify-content:center;margin-top:10px;}
  .hero-ring{width:168px;height:168px;border-radius:50%;background:radial-gradient(circle at 50% 40%,var(--card2),var(--card));border:1px solid var(--border);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 14px color-mix(in srgb,var(--primary) 6%,transparent),0 0 0 30px color-mix(in srgb,var(--primary) 3%,transparent);}
  .hero-ring img{width:64%;height:64%;object-fit:contain;}
  .float-tile{position:absolute;width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;animation:floaty 5s ease-in-out infinite;}
  .float-tile svg{width:24px;height:24px;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
  .float-tile.t1{top:18px;left:calc(50% - 30px);background:var(--gold-soft);} .float-tile.t1 svg{stroke:var(--gold);}
  .float-tile.t2{top:104px;left:calc(50% - 150px);background:var(--blue-soft);animation-delay:-1.6s;} .float-tile.t2 svg{stroke:var(--blue);}
  .float-tile.t3{top:84px;right:calc(50% - 150px);background:var(--primary-soft);animation-delay:-3.2s;} .float-tile.t3 svg{stroke:var(--primary);}
  @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  .welcome-copy{position:relative;text-align:center;margin-top:8px;}
  .welcome-copy h1{font-family:var(--f);font-size:17px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;margin:0 0 10px;color:var(--text);}
  .welcome-copy p{color:var(--text-soft);font-size:14px;line-height:1.55;margin:0 auto;max-width:290px;}
  .dots{display:flex;gap:6px;justify-content:center;margin:26px 0 0;}
  .dots span{width:6px;height:6px;border-radius:4px;background:var(--border);} .dots span.on{width:22px;background:var(--primary);}
  .welcome-actions{position:relative;display:flex;gap:12px;margin-top:auto;padding-top:34px;}
  .welcome-actions .btn{flex:1;height:50px;border-radius:12px;font-size:15px;justify-content:center;display:flex;align-items:center;}
  .btn.primary-glow{box-shadow:0 10px 24px -8px color-mix(in srgb,var(--primary) 55%,transparent);}
  .btn.outline{background:transparent;color:var(--primary);border:1.5px solid var(--primary);}
  .auth-back{width:40px;height:40px;border-radius:50%;background:var(--card2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;margin:6px 0 20px;}
  .auth-back svg{width:18px;height:18px;stroke:var(--primary);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}
  .auth-title{font-family:var(--f);font-size:32px;line-height:1.12;font-weight:700;margin:0 0 8px;color:var(--text);}
  .auth-sub{color:var(--text-soft);font-size:13.5px;margin:0 0 22px;line-height:1.5;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:12.5px;font-weight:700;color:var(--text);margin-bottom:7px;}
  .field-box{position:relative;}
  .field-box input,.field-box select{width:100%;height:50px;border-radius:12px;background:var(--card2) !important;border:1px solid transparent !important;padding:0 46px 0 14px !important;color:var(--text);box-sizing:border-box;}
  .field-box select{padding-right:14px !important;}
  .field-box input:focus,.field-box select:focus{border-color:var(--primary) !important;outline:none;}
  .field-icon{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;display:flex;align-items:center;justify-content:center;background:none;border:0;padding:0;cursor:pointer;}
  .field-icon svg{width:20px;height:20px;fill:none;stroke:var(--text-faint);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
  .field-icon.ok svg{stroke:var(--primary);}
  .field-row{display:flex;gap:10px;} .field-row .field{flex:1;min-width:0;}
  .seg{display:flex;background:var(--card2);border-radius:12px;padding:4px;gap:4px;margin-bottom:16px;}
  .seg button{flex:1;height:40px;border:0;border-radius:9px;background:transparent;color:var(--text-soft);font-weight:700;font-family:var(--f);font-size:13.5px;cursor:pointer;}
  .seg button.active{background:var(--primary);color:var(--on-pri);}
  .auth-submit{width:100%;height:52px;border-radius:12px;font-size:15px;justify-content:center;display:flex;align-items:center;margin-top:8px;}
  .auth-foot{text-align:center;font-size:13px;color:var(--text-soft);margin-top:22px;}
  .auth-foot a{color:var(--primary);font-weight:700;text-decoration:underline;cursor:pointer;}
  .auth-note{font-size:12px;color:var(--text-faint);margin:-6px 0 16px;line-height:1.5;}
  .auth-error{background:var(--absent-bg);color:var(--absent);border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:14px;font-weight:600;}
  .locked-chip{display:flex;align-items:center;gap:12px;background:var(--card2);border-radius:14px;padding:12px 14px;margin-bottom:18px;}
  .locked-chip .account-avatar{flex-shrink:0;}
  .song-actions{display:flex;gap:6px;margin-right:6px;}
  .song-actions .btn{padding:6px 10px;font-size:12px;}

  /* ===== Offline screen ===== */
  #offline-screen{position:fixed;inset:0;z-index:20000;background:var(--bg);display:none;flex-direction:column;}
  #offline-screen.show{display:flex;animation:offIn .25s ease;}
  @keyframes offIn{from{opacity:0}to{opacity:1}}
  .off-head{background:linear-gradient(90deg,var(--primary-dark),var(--primary));padding:calc(env(safe-area-inset-top) + 18px) 20px 18px;text-align:center;font-family:var(--f);font-weight:800;font-size:18px;color:#fff;box-shadow:0 4px 18px rgba(0,0,0,.35);}
  .off-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;}
  .off-rings{position:relative;width:300px;height:300px;display:flex;align-items:center;justify-content:center;}
  .off-rings .r{position:absolute;border-radius:50%;background:rgba(255,255,255,0.025);}
  .off-rings .r1{inset:0;} .off-rings .r2{inset:36px;background:rgba(255,255,255,0.035);} .off-rings .r3{inset:64px;background:var(--card);}
  .off-disc{position:relative;width:150px;height:150px;border-radius:50%;background:linear-gradient(135deg,var(--primary-dark),var(--primary));display:flex;align-items:center;justify-content:center;box-shadow:0 18px 40px -10px color-mix(in srgb,var(--primary) 55%,transparent);animation:offPulse 2.6s ease-in-out infinite;}
  .off-disc::after{content:'';position:absolute;inset:26px;border-radius:50%;background:rgba(0,0,0,0.12);box-shadow:inset 0 2px 10px rgba(0,0,0,.18);}
  .off-disc svg{position:relative;z-index:1;width:56px;height:56px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  @keyframes offPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
  .off-spark{position:absolute;color:var(--primary);opacity:.75;}
  .off-spark svg{width:16px;height:16px;fill:currentColor;}
  .off-dot{position:absolute;width:11px;height:11px;border-radius:50%;border:2px solid var(--primary);opacity:.6;}
  .off-sq{position:absolute;width:7px;height:7px;background:var(--primary);opacity:.35;border-radius:1px;}
  .off-body h2{font-family:var(--f);font-size:30px;margin:26px 0 8px;color:var(--text);}
  .off-body p{color:var(--text-soft);font-size:14.5px;line-height:1.55;max-width:280px;margin:0 0 26px;}
  .off-body .btn{height:50px;min-width:200px;border-radius:12px;font-size:15px;display:flex;align-items:center;justify-content:center;}

  /* ===== v6: members, details, profile, attendance ===== */
  .avatar{border-radius:50%;background:linear-gradient(135deg,var(--primary-dark),var(--primary));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;overflow:hidden;font-family:var(--f);}
  .avatar img{width:100%;height:100%;object-fit:cover;display:block;}
  .mhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:6px 2px 14px;}
  .mtitle{font-family:var(--f);font-size:28px;margin:0;color:var(--text);line-height:1.1;}
  .msub{font-size:12.5px;color:var(--text-soft);margin-top:4px;}
  .fab{width:48px;height:48px;border-radius:50%;border:0;background:var(--primary);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;box-shadow:0 8px 20px -6px color-mix(in srgb,var(--primary) 60%,transparent);}

  .mcard.tap{cursor:pointer;transition:transform .12s, border-color .2s;} .mcard.tap:active{transform:scale(.985);border-color:var(--primary);}
  .mcard-top{display:flex;align-items:center;gap:12px;min-width:0;}
  .mcard-id{flex:1;min-width:0;}
  .mcard-name{font-weight:700;font-size:15px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .mcard-pos{font-size:12.5px;color:var(--text-soft);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .mbadge{flex-shrink:0;font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;}
  .mbadge.admin{background:var(--purple-soft);color:var(--purple);} .mbadge.leader{background:var(--gold-soft);color:var(--gold);}
  .mcard-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;border-top:1px solid var(--border);margin-top:12px;padding-top:12px;}
  .mcard-grid div{min-width:0;} .mcard-grid div:nth-child(2){text-align:center;} .mcard-grid div:nth-child(3){text-align:right;}
  .mcard-grid b{display:block;font-size:13px;color:var(--text);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .mcard-grid span{display:block;font-size:11px;color:var(--text-faint);margin-top:2px;}
  .unlock-card{display:flex;gap:12px;align-items:flex-start;}
  .unlock-ic{width:40px;height:40px;border-radius:12px;background:var(--primary-soft);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .unlock-ic svg,.drow-ic svg{width:20px;height:20px;fill:none;stroke:var(--primary);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
  .dhero,.phero{background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--border);border-radius:22px;padding:14px 14px 18px;margin-bottom:16px;text-align:center;position:relative;overflow:hidden;}
  .dhero::before,.phero::before{content:'';position:absolute;width:260px;height:260px;border-radius:50%;background:var(--primary-soft);top:-150px;right:-90px;}
  .dhero > *,.phero > *{position:relative;}
  .dhero-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-weight:700;color:var(--text);font-size:15px;}
  .dhero-bar .auth-back svg{stroke:var(--primary);}
  .dhero .avatar{margin:0 auto;box-shadow:0 0 0 4px var(--card),0 0 0 6px var(--primary-soft);}
  .dname{font-family:var(--f);font-size:24px;font-weight:700;color:var(--text);margin-top:12px;word-break:break-word;}
  .dpos{font-size:13px;color:var(--text-soft);margin-top:3px;}
  .dacts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:16px;}
  .dact{display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 4px;border:1px solid var(--border);border-radius:12px;background:rgba(255,255,255,0.03);color:var(--text);text-decoration:none;font-size:11.5px;font-weight:600;min-width:0;}
  .dact svg{width:20px;height:20px;fill:none;stroke:var(--primary);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
  .dact.off{opacity:.35;}
  .dcard{padding:6px 16px;}
  .drow{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--border);min-width:0;}
  .drow:last-child{border-bottom:0;}
  .drow-ic{width:36px;height:36px;border-radius:10px;background:var(--primary-soft);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .drow-txt{flex:1;min-width:0;}
  .drow-txt span{display:block;font-size:11.5px;color:var(--text-faint);}
  .drow-txt b{display:block;font-size:14.5px;color:var(--text);font-weight:600;margin-top:2px;overflow-wrap:anywhere;}
  .drow-txt b i{color:var(--text-faint);font-weight:500;font-style:normal;}
  .drow-txt small{display:block;font-size:12px;color:var(--text-soft);margin-top:2px;}
  .dmanage{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .dmanage .btn{justify-content:center;display:flex;}
  .pphoto{width:120px;height:120px;border-radius:50%;margin:4px auto 0;position:relative;box-shadow:0 0 0 4px var(--card),0 0 0 6px var(--primary-soft);}
  .pphoto img,.pphoto-ph{width:100%;height:100%;border-radius:50%;object-fit:cover;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--primary-dark),var(--primary));color:#fff;font-size:44px;font-weight:700;}
  .pcam{position:absolute;right:-2px;bottom:-2px;width:40px;height:40px;border-radius:50%;background:var(--primary);display:flex;align-items:center;justify-content:center;cursor:pointer;border:3px solid var(--card);}
  .pcam svg{width:18px;height:18px;fill:none;stroke:var(--on-pri);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .plink{background:none;border:0;color:var(--primary);font-size:12.5px;font-weight:600;margin-top:10px;cursor:pointer;font-family:var(--f);}
  .live-chip{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;padding:5px 11px;border-radius:999px;background:rgba(61,213,152,.14);color:var(--present);}
  .live-chip i{width:8px;height:8px;border-radius:50%;background:var(--present);animation:livePulse 1.4s infinite;}
  .live-chip.wait{background:var(--late-bg);color:var(--late);} .live-chip.closed{background:rgba(255,255,255,.06);color:var(--text-soft);}
  @keyframes livePulse{0%,100%{opacity:1}50%{opacity:.3}}
  details.extra-session summary{cursor:pointer;list-style:none;} details.extra-session summary::-webkit-details-marker{display:none;}
  details.extra-session summary::after{content:'＋';float:right;color:var(--primary);font-weight:700;}
  details.extra-session[open] summary::after{content:'－';}
  .sms-opt{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--text-soft);margin:4px 0 12px;}
  .sms-opt input{width:18px;height:18px;accent-color:var(--primary);}
  .roll-row{gap:8px;flex-wrap:wrap;} .status-btns{flex-wrap:wrap;}
  input[type=tel],input[type=email],input[type=number]{background:var(--card2);border:1px solid var(--border);color:var(--text);border-radius:9px;padding:9px 11px;font-family:var(--f);}

  /* ===== v7: schedule + reports ===== */
  .sch-row{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);min-width:0;}
  .sch-row:last-child{border-bottom:0;}
  .sch-date{width:48px;flex-shrink:0;height:52px;border-radius:12px;background:var(--card2);border:1px solid var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;}
  .sch-date b{font-size:18px;color:var(--text);} .sch-date span{font-size:10.5px;color:var(--text-soft);text-transform:uppercase;letter-spacing:.04em;margin-top:2px;}
  .sch-main{flex:1;min-width:0;}
  .sch-tags{display:flex;gap:6px;flex-wrap:wrap;}
  .sch-title{font-weight:700;color:var(--text);font-size:14.5px;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .sch-meta{font-size:12.5px;color:var(--text-soft);margin-top:3px;}
  .sch-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;}
  .tag.past{background:rgba(255,255,255,.07);color:var(--text-soft);} .tag.today{background:rgba(61,213,152,.14);color:var(--present);}
  .tag.upcoming{background:var(--blue-soft);color:var(--blue);} .tag.weekly{background:var(--purple-soft);color:var(--purple);}
  .rep-head{margin:6px 2px 14px;}
  .rep-filters{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin-bottom:14px;}
  .rep-filters select{height:44px !important;}
  .rep-tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:16px;}
  .rep-tile{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px 10px;text-align:center;min-width:0;}
  .rep-tile b{display:block;font-size:22px;color:var(--text);font-family:var(--f);}
  .rep-tile span{display:block;font-size:11px;color:var(--text-soft);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .rc-wrap{width:100%;overflow:hidden;}
  .rc-svg{width:100%;height:auto;display:block;}
  .rc-grid{stroke:var(--border);stroke-width:1;} .rc-ax{fill:var(--text-faint);font-size:9.5px;font-family:var(--f);}
  .rc-line{fill:none;stroke:var(--primary);stroke-width:2;stroke-linejoin:round;stroke-linecap:round;}
  .rc-area{fill:var(--primary-soft);} .rc-dot{fill:var(--primary);stroke:var(--card);stroke-width:2;} .rc-dot.on{stroke:var(--text);}
  .rc-cross{stroke:var(--text-faint);stroke-dasharray:3 3;} .rc-tip{fill:var(--card2);stroke:var(--border);}
  .rc-tip-t{fill:var(--text-soft);font-size:9.5px;font-family:var(--f);} .rc-tip-v{fill:var(--text);font-size:11px;font-weight:700;font-family:var(--f);}
  .rep-split{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--border);margin-top:12px;padding-top:12px;text-align:center;}
  .rep-split div{min-width:0;} .rep-split div + div{border-left:1px solid var(--border);}
  .rep-split b{display:block;font-size:18px;} .rep-split span{display:block;font-size:11.5px;color:var(--text-soft);margin-top:2px;}
  .c-on{color:var(--present);} .c-late{color:var(--late);} .c-abs{color:var(--absent);}
  .rep-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--text-soft);margin:-2px 0 8px;}
  .rep-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;}
  .s-on{background:var(--present);} .s-late{background:var(--late);} .s-abs{background:var(--absent);} .s-exc{background:var(--purple);}
  .rep-mrow{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);min-width:0;}

  .rep-mmain{flex:1;min-width:0;}
  .rep-mtop{display:flex;justify-content:space-between;gap:8px;align-items:baseline;}
  .rep-mname{font-weight:600;color:var(--text);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;}
  .rep-mtop b{color:var(--text);font-size:14px;flex-shrink:0;}
  .rep-bar{display:flex;gap:2px;height:8px;margin-top:6px;border-radius:4px;overflow:hidden;background:var(--card2);}
  .rep-bar i{display:block;height:100%;min-width:3px;}
  .rep-msub{font-size:11.5px;color:var(--text-faint);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .rep-hrow{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);min-width:0;}
  .rep-hrow:last-child{border-bottom:0;}
  .rep-hmain{flex:1;min-width:0;} .rep-hmain .sch-title{margin-top:0;}
  .rep-hcounts{display:flex;gap:10px;flex-wrap:wrap;font-size:11.5px;font-weight:600;margin-top:4px;}
  .rep-hside{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0;}
  .rep-hside b{color:var(--text);font-size:15px;}
  .icon-del{width:30px;height:30px;border-radius:9px;border:1px solid var(--border);background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;}
  .icon-del svg{width:15px;height:15px;fill:none;stroke:var(--absent);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}

  .motto{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 12px;margin-top:14px;font-size:12.5px;font-weight:700;color:var(--primary);letter-spacing:.02em;}
  .motto span{white-space:nowrap;}
  .welcome-card{position:relative;overflow:hidden;background:linear-gradient(150deg,var(--card2),var(--card));border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:16px;}

  .welcome-card > *{position:relative;z-index:1;}
  .welcome-card h2{font-family:var(--f);font-size:20px;margin:0 0 6px;color:var(--text);}
  .welcome-card p{margin:0;color:var(--text-soft);font-size:13.5px;line-height:1.55;}
  .welcome-card .motto{justify-content:flex-start;margin-top:12px;}

  .media-frame{width:100%;margin-top:8px;border-radius:12px;overflow:hidden;background:var(--card2);}
  .media-frame iframe{width:100%;height:100%;border:0;display:block;}

  .media-link b{display:block;color:var(--text);font-size:14px;} .media-link span{display:block;font-size:12px;color:var(--text-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .media-link .media-open{margin-top:0;flex-shrink:0;}
  .song-body audio{width:100%;margin-top:8px;}

  .song-list .song-item{background:var(--card);border:1px solid var(--border);border-radius:16px;margin-bottom:10px;overflow:hidden;}
  .song-list .song-head{gap:12px;}
  .song-ic{width:40px;height:40px;border-radius:12px;background:var(--primary-soft);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .song-ic svg{width:20px;height:20px;fill:none;stroke:var(--primary);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
  .song-snip{font-size:12px;color:var(--text-soft);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .song-snip mark{background:var(--primary-soft);color:var(--primary);border-radius:3px;padding:0 2px;}
  .song-list .song-title,.song-list .song-cat{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  /* ===== Songs: library list + now playing ===== */
  .sl-list{display:flex;flex-direction:column;gap:4px;}
  .sl-row{display:flex;align-items:center;gap:14px;padding:9px 6px;border-radius:14px;cursor:pointer;min-width:0;transition:background .15s;}
  .sl-row:active{background:var(--card);}
  .sl-art{width:56px;height:56px;border-radius:14px;flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center;}
  .sl-art img,.np-art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;}
  .sl-art svg,.np-art svg{fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
  .sl-art svg{width:26px;height:26px;}
  .sl-main{flex:1;min-width:0;}
  .sl-title{font-weight:700;font-size:15px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .sl-sub{font-size:12.5px;color:var(--text-soft);margin-top:4px;display:flex;align-items:center;gap:7px;white-space:nowrap;overflow:hidden;}
  .sl-sub .dot{width:4px;height:4px;border-radius:50%;background:var(--text-faint);display:inline-block;flex-shrink:0;}
  .sl-play{width:38px;height:38px;border-radius:50%;background:var(--card2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--text-soft);}
  .sl-play.has{color:var(--text);}
  .sl-play svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
  .np{position:relative;border-radius:26px;padding:14px 16px 20px;margin-bottom:16px;overflow:hidden;background:radial-gradient(120% 70% at 50% 0%, color-mix(in srgb,var(--primary) 28%,transparent), transparent 70%), linear-gradient(180deg,var(--card2),var(--bg));border:1px solid var(--border);}
  .np-bar{display:flex;align-items:center;justify-content:space-between;color:var(--text);font-weight:700;font-size:15.5px;}
  .np-circ{width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text);}
  .np-circ svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}
  .np-menu{position:absolute;right:16px;top:60px;z-index:5;background:var(--card2);border:1px solid var(--border);border-radius:12px;overflow:hidden;box-shadow:0 12px 30px rgba(0,0,0,.4);}
  .np-menu button{display:block;width:100%;text-align:left;padding:12px 18px;background:none;border:0;color:var(--text);font-weight:600;font-size:14px;font-family:var(--f);cursor:pointer;}
  .np-menu button + button{border-top:1px solid var(--border);} .np-menu .del{color:var(--absent);}
  .np-art-wrap{display:flex;justify-content:center;margin:20px 0 18px;}
  .np-art{width:210px;height:210px;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;box-shadow:0 24px 50px -16px rgba(0,0,0,.6),0 0 0 6px rgba(255,255,255,.04);}
  .np-art img{width:100%;height:100%;object-fit:cover;}
  .np-art svg{width:72px;height:72px;}
  .np-title{text-align:center;font-family:var(--f);font-size:24px;font-weight:700;color:var(--text);line-height:1.2;overflow-wrap:anywhere;}
  .np-sub{text-align:center;color:var(--text-soft);font-size:13px;margin-top:6px;}
  .np-embed{margin-top:16px;} .np-embed .media-open{display:none;}
  .np-noaudio{text-align:center;color:var(--text-faint);font-size:13px;margin:16px 0 0;}
  .np-prog{margin-top:20px;}
  #np-seek{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:4px;background:linear-gradient(90deg,var(--primary) var(--p,0%),rgba(255,255,255,.15) var(--p,0%));outline:none;margin:0;padding:0;border:0;}
  #np-seek::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--primary);box-shadow:0 0 0 4px color-mix(in srgb,var(--primary) 25%,transparent);}
  #np-seek::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--primary);border:0;}
  .np-times{display:flex;justify-content:space-between;font-size:11.5px;color:var(--text-faint);margin-top:8px;font-variant-numeric:tabular-nums;}
  .np-ctrls{display:flex;align-items:center;justify-content:space-between;margin-top:16px;padding:0 2px;}
  .np-ic{width:40px;height:40px;border:0;background:none;color:var(--text-soft);display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .np-ic.on{color:var(--primary);}
  .np-ic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
  .np-round{width:48px;height:48px;border-radius:50%;border:0;background:rgba(255,255,255,.08);color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .np-round svg{width:20px;height:20px;}
  .np-play{width:66px;height:66px;border-radius:50%;border:0;background:var(--primary);color:var(--on-pri);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 12px 26px -8px color-mix(in srgb,var(--primary) 70%,transparent);text-decoration:none;}
  .np-play svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}

  .nb{position:relative;border-radius:18px;padding:16px;margin-bottom:14px;background:linear-gradient(135deg,var(--b),var(--card));border:1px solid var(--c);animation:fadeUp .4s ease both;}
  .nb-top{display:flex;gap:12px;align-items:center;}
  .nb-ic{width:36px;height:36px;border-radius:50%;background:var(--c);color:var(--on-pri);font-weight:900;font-size:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .nb-top b{display:block;color:var(--text);font-size:15.5px;} .nb-top small{display:block;color:var(--c);font-size:12px;font-weight:700;margin-top:2px;}
  .nb p{color:var(--text);font-size:14px;line-height:1.5;margin:12px 0 0;white-space:pre-wrap;overflow-wrap:anywhere;}
  .nb .nb-help{color:var(--text-soft);font-size:12.5px;margin-top:8px;}
  .nb-until{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding:8px 12px;border-radius:10px;background:rgba(0,0,0,.2);font-size:13px;color:var(--text);} .nb-until b{color:var(--c);}
  .nb-ack{margin-top:12px;width:100%;justify-content:center;display:flex;background:var(--c) !important;border-color:var(--c) !important;color:var(--on-pri) !important;}
  .nb-acked{margin-top:10px;font-size:12px;color:var(--text-soft);}
  .disc-vis{font-size:11.5px;color:var(--text-soft);margin-top:6px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px 18px;margin-bottom:16px;}
  .card h2{font-family:var(--f);font-weight:600;font-size:17px;margin:0 0 4px;color:var(--text);}
  .card .desc{font-size:12.5px;color:var(--text-soft);margin:0 0 14px;}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:9px;align-items:center;}
  input[type=text], input[type=time], input[type=date], input[type=url], select, textarea{
    font-family:var(--f);padding:9px 11px;border:1px solid var(--border);border-radius:9px;font-size:13.5px;background:var(--card2);color:var(--text);
  }
  textarea{width:100%;resize:vertical;min-height:90px;line-height:1.6;}
  input::placeholder, textarea::placeholder{color:var(--text-faint);}
  input:focus, select:focus, textarea:focus{outline:2px solid var(--primary-soft);outline-offset:1px;border-color:var(--primary);}
  button.btn{font-family:var(--f);font-weight:700;font-size:13.5px;padding:9px 15px;border-radius:9px;border:1px solid var(--primary);background:var(--primary);color:var(--on-pri);cursor:pointer;transition:background .15s, transform .15s;}
  button.btn:hover{background:var(--primary-dark);}
  button.btn:active{transform:scale(0.97);}
  button.btn.ghost{background:transparent;color:var(--primary);border:1px solid var(--border);}
  button.btn.ghost:hover{border-color:var(--primary);}
  button.btn.ghost.active{background:var(--primary-soft);border-color:var(--primary);}
  button.btn.danger{background:transparent;color:var(--absent);border:1px solid var(--absent-bg);padding:6px 10px;font-size:12px;font-weight:600;}
  button.btn.danger:hover{background:var(--absent-bg);}
  button.btn.small{padding:6px 10px;font-size:12px;}
  .list-item{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--border);gap:10px;}
  .list-item:last-child{border-bottom:none;}
  .li-main{font-weight:700;font-size:14px;display:flex;align-items:center;flex-wrap:wrap;gap:2px;}
  .li-sub{font-size:12px;color:var(--text-soft);margin-top:2px;}
  .li-actions{display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end;}
  .tag{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:20px;text-transform:uppercase;letter-spacing:0.3px;}
  .tag.rehearsal{background:var(--purple-soft);color:var(--purple);}
  .tag.service{background:var(--blue-soft);color:var(--blue);}
  .leader-chip{background:var(--gold-soft);color:var(--gold);font-size:9.5px;font-weight:700;padding:2px 7px;border-radius:20px;margin-left:4px;text-transform:uppercase;letter-spacing:0.3px;}
  .admin-chip{background:var(--blue-soft);color:var(--blue);font-size:9.5px;font-weight:700;padding:2px 7px;border-radius:20px;margin-left:4px;text-transform:uppercase;letter-spacing:0.3px;}
  .you-chip{background:var(--primary-soft);color:var(--primary);font-size:9.5px;font-weight:700;padding:2px 7px;border-radius:20px;margin-left:4px;text-transform:uppercase;letter-spacing:0.3px;}
  .tag.generic{background:var(--card2);color:var(--text-soft);border:1px solid var(--border);}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:94px;background:var(--card2);border:1px solid var(--border);color:var(--text);padding:10px 18px;border-radius:30px;font-size:12.5px;font-weight:600;z-index:200;box-shadow:0 4px 18px rgba(0,0,0,0.4);opacity:0;pointer-events:none;transition:opacity .25s;max-width:85%;text-align:center;}
  .toast.show{opacity:1;}
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:100;padding:24px;}
  .modal-box{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;max-width:340px;width:100%;}
  .modal-box p{font-size:14px;color:var(--text);margin:0 0 18px;line-height:1.5;}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;}
  .account-card .account-row{display:flex;align-items:center;gap:12px;}
  .account-avatar{width:44px;height:44px;border-radius:50%;background:var(--primary-soft);color:var(--primary);font-family:var(--f);font-weight:700;font-size:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  button.btn.danger#logout-btn{border:1px solid var(--absent);padding:10px 15px;font-size:13.5px;}
  button.btn.danger#logout-btn:hover{background:var(--absent-bg);}
  .empty{text-align:center;padding:30px 10px;color:var(--text-soft);font-size:13.5px;}
  .empty i{display:block;font-size:11.5px;margin-top:4px;color:var(--text-faint);}

  .roll-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border);gap:10px;flex-wrap:wrap;}
  .roll-row:last-child{border-bottom:none;}
  .roll-name{font-weight:700;font-size:14px;min-width:120px;}
  .roll-voice{font-size:11.5px;color:var(--text-soft);}
  .status-btns{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
  .stamp{border:1.3px solid var(--border);background:var(--card2);border-radius:20px;padding:6px 12px;font-size:11.5px;font-weight:700;cursor:pointer;color:var(--text-soft);text-transform:uppercase;letter-spacing:0.2px;transition:all .15s;}
  .stamp.present.on{background:var(--primary-soft);border-color:var(--present);color:var(--present);}
  .stamp.late.on{background:var(--late-bg);border-color:var(--late);color:var(--late);}
  .stamp.absent.on{background:var(--absent-bg);border-color:var(--absent);color:var(--absent);}
  .stamp.excused.on{background:var(--purple-soft);border-color:var(--purple);color:var(--purple);}
  .time-badge{font-size:11.5px;color:var(--text-soft);font-variant-numeric:tabular-nums;min-width:48px;text-align:right;}
  .drag-handle{cursor:grab;touch-action:none;color:var(--text-faint);font-size:18px;line-height:1;user-select:none;padding:4px 8px 4px 0;flex-shrink:0;}
  .drag-handle:active{cursor:grabbing;}
  .roll-row.dragging-row{opacity:0.55;background:var(--card2);border-radius:10px;}

  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:10px;margin-bottom:16px;}
  .stat{background:var(--card2);border-radius:10px;padding:11px 12px;}
  .stat .num{font-family:var(--f);font-size:22px;font-weight:600;color:var(--primary);}
  .stat .lbl{font-size:10.5px;color:var(--text-soft);text-transform:uppercase;letter-spacing:0.2px;margin-top:2px;}

  table.rep{width:100%;border-collapse:collapse;font-size:12.5px;}
  table.rep th{text-align:left;font-size:10.5px;text-transform:uppercase;color:var(--text-soft);padding:6px 6px;border-bottom:1px solid var(--border);letter-spacing:0.2px;}
  table.rep td{padding:9px 6px;border-bottom:1px solid var(--border);}
  table.rep tr:last-child td{border-bottom:none;}
  .bar-bg{background:var(--border);border-radius:20px;height:6px;width:100%;overflow:hidden;}
  .bar-fill{background:var(--primary);height:100%;border-radius:20px;}

  .song-item{border:1px solid var(--border);border-radius:12px;margin-bottom:10px;overflow:hidden;background:var(--card2);}
  .song-head{display:flex;justify-content:space-between;align-items:center;padding:13px 14px;cursor:pointer;}
  .song-title{font-weight:700;font-size:14px;}
  .song-cat{font-size:11px;color:var(--text-soft);margin-top:2px;}
  .song-chevron{width:16px;height:16px;stroke:var(--text-faint);transition:transform .2s;flex-shrink:0;}
  .song-item.open .song-chevron{transform:rotate(180deg);}
  .song-body{display:grid;grid-template-rows:0fr;overflow:hidden;transition:grid-template-rows .25s ease;}
  .song-item.open .song-body{grid-template-rows:1fr;}
  .song-body-inner{padding:0 14px;min-height:0;overflow:hidden;}
  .song-body-inner::after{content:'';display:block;height:16px;}
  .lyrics{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;line-height:1.8;color:var(--text-soft);border-top:1px solid var(--border);padding-top:12px;}
  audio{width:100%;margin-top:10px;height:34px;}

  /* QR + scanner */
  .qr-wrap{background:#fff;border-radius:14px;padding:18px;display:flex;flex-direction:column;align-items:center;gap:10px;}
  .qr-wrap #qr-box{display:flex;align-items:center;justify-content:center;}
  .qr-code-text{font-family:var(--f);font-size:24px;letter-spacing:5px;font-weight:700;color:#1A1A1A;background:#F1EFEA;padding:8px 16px;border-radius:8px;}
  .qr-caption{font-size:11.5px;color:#6B6560;text-align:center;}
  .checkin-feed{margin-top:14px;}
  .checkin-feed .cf-row{display:flex;justify-content:space-between;font-size:12.5px;padding:7px 0;border-bottom:1px solid var(--border);}
  .checkin-feed .cf-row:last-child{border-bottom:none;}
  .scan-video-wrap{position:relative;border-radius:14px;overflow:hidden;background:#000;}
  .scan-frame{position:absolute;inset:15%;border:2px solid var(--primary);border-radius:12px;pointer-events:none;}
  .scan-msg{text-align:center;font-size:12.5px;color:var(--text-soft);margin-top:10px;}
  .scan-msg.err{color:var(--absent);}
  .scan-msg.ok{color:var(--present);}

  nav.bottomnav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:420px;background:var(--card);border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:8px 2px 12px;z-index:10;}
  nav.bottomnav button{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;color:var(--text-faint);padding:2px 4px;font-family:var(--f);}
  .nav-icon-wrap{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:background .2s;}
  nav.bottomnav button svg{width:18px;height:18px;stroke:var(--text-faint);transition:stroke .2s;}
  nav.bottomnav button span{font-size:9.5px;font-weight:600;transition:color .2s;}
  nav.bottomnav button.active .nav-icon-wrap{background:var(--primary-soft);}
  nav.bottomnav button.active svg{stroke:var(--primary);}
  nav.bottomnav button.active span{color:var(--primary);}
  .push-hint{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--border);border-left:3px solid var(--blue);border-radius:14px;padding:14px;margin:0 0 16px;}
  .push-hint-ic{font-size:22px;line-height:1;}
  .push-hint b{display:block;color:var(--text);font-size:15px;margin-bottom:3px;}
  .push-hint span{display:block;color:var(--text-soft);font-size:13px;line-height:1.45;}
  .push-hint-btns{display:flex;gap:8px;margin-top:10px;}

  /* ---------- v16: theme toggle, planner link, wide screens ---------- */
  #theme-toggle .ic-moon{display:none}
  :root.light #theme-toggle .ic-sun{display:none}
  :root.light #theme-toggle .ic-moon{display:block}
  body.logged-out #theme-toggle{display:none}
  .side-brand,.side-grp,.side-foot,nav.bottomnav .side-only{display:none}
  :root.light .icon-btn{background:var(--card);}
  :root.light .banner, :root.light .banner h2{color:#fff}
  :root.light nav.bottomnav{background:rgba(255,255,255,.94)}
  .card{box-shadow:var(--glow)}
  h1,h2,h3,.li-main{letter-spacing:-.01em}
  @media (min-width: 600px) and (max-width: 899px){
    .phone, nav.bottomnav, .chat-compose{max-width:680px;}
  }
  @media (min-width: 900px){
    .phone{max-width:none;margin:0 0 0 264px;padding-bottom:40px;}
    body.logged-out .phone{margin:0 auto;max-width:520px;}
    header.appbar{background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--border);padding:16px 32px 14px;}
    header.appbar .brand-mark{display:none}
    header.appbar .appbar-loc .name{font-size:18px;font-weight:800}
    .search-bar{max-width:560px}
    main{padding:22px 32px 40px;max-width:1240px;}
    nav.bottomnav{left:12px;top:12px;bottom:12px;transform:none;width:240px;max-width:none;flex-direction:column;justify-content:flex-start;align-items:stretch;gap:2px;padding:0 10px 12px;border:1px solid var(--border);border-radius:20px;background:var(--side-bg);backdrop-filter:blur(16px);box-shadow:var(--shadow);overflow-y:auto;}
    body.logged-out nav.bottomnav{display:none}
    nav.bottomnav .side-brand{display:flex;gap:10px;align-items:center;padding:18px 6px 10px;}
    nav.bottomnav .side-brand img{width:40px;height:40px;border-radius:12px;background:#fff;padding:3px;object-fit:contain}
    nav.bottomnav .side-brand b{display:block;font-size:15px;font-weight:800;line-height:1.15;color:var(--text)}
    nav.bottomnav .side-brand span{font-size:11.5px;color:var(--text-soft)}
    nav.bottomnav .side-grp{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--text-faint);padding:14px 10px 4px;font-weight:700}
    nav.bottomnav .side-only{display:flex}
    nav.bottomnav .side-plan{display:none}
    body.can-plan nav.bottomnav .side-plan{display:flex}
    body.can-plan nav.bottomnav .side-grp.side-plan{display:block}
    nav.bottomnav button{flex-direction:row;gap:11px;padding:9px 10px;border-radius:11px;width:100%;border:1px solid transparent;text-align:left}
    nav.bottomnav button span{font-size:14px;font-weight:500;color:var(--text)}
    nav.bottomnav button .nav-icon-wrap{background:none!important;width:auto;height:auto;padding:0}
    nav.bottomnav button svg{stroke:var(--text-soft)}
    nav.bottomnav button:hover{background:var(--primary-soft)}
    nav.bottomnav button.active{background:var(--primary-soft);border-color:color-mix(in srgb,var(--primary) 45%,transparent)}
    nav.bottomnav button.active span{font-weight:700}
    nav.bottomnav .side-foot{display:block;margin-top:auto;padding-top:12px;border-top:1px solid var(--border)}
    .side-theme{width:100%;background:none;border:0;color:var(--text-soft);font:inherit;font-size:13px;padding:8px 10px;text-align:left;cursor:pointer;border-radius:10px}
    .side-theme:hover{background:var(--primary-soft)}
    .side-theme .t-d{display:none} :root.light .side-theme .t-l{display:none} :root.light .side-theme .t-d{display:inline}
    #theme-toggle{display:none}
    .chat-compose{left:calc(264px + (100vw - 264px) / 2);max-width:760px;bottom:0;}
    .grid-actions{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));}
    .mcard-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px;}
    .mcard-list .mcard{margin:0}
    .sl-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:4px 18px;}
  }

  /* ---------- Aurum look: glass cards, rounded pills, floating nav ---------- */
  .card,.mcard,.modal-box{background:var(--glass);border-color:var(--border);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:var(--shadow)}
  .modal-box{background:var(--card)}
  .card,.mcard{border-radius:var(--radius)}
  header.appbar{background:color-mix(in srgb,var(--bg-a) 78%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--border)}
  .icon-btn{background:var(--glass2);border-color:var(--border)}
  .search-bar{background:color-mix(in srgb,var(--card) 70%,transparent);border-color:var(--border);border-radius:14px}
  button.btn{border-radius:14px;font-weight:600}
  button.btn:not(.ghost):not(.small):not(.danger){box-shadow:0 8px 18px -8px color-mix(in srgb,var(--primary) 70%,transparent)}
  .chip{border-radius:999px}
  nav.bottomnav{background:color-mix(in srgb,var(--bg-b) 84%,transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--border);border-radius:22px 22px 0 0}
  :root.light nav.bottomnav{background:rgba(255,255,255,.9)}
  .banner{border:1px solid rgba(255,255,255,.18);box-shadow:var(--shadow)}
  .banner .bbtn.solid{background:#F5B942;color:#5A3B00}
  .banner .eyebrow{color:var(--hero-tint)}
  h1,h2,h3{font-weight:600;letter-spacing:-.01em}
  .stat-strip .num{font-weight:600}
</style>
</head>
<body>
<div id="offline-screen" role="alertdialog" aria-live="assertive">
  <div class="off-head">You are offline</div>
  <div class="off-body">
    <div class="off-rings">
      <div class="r r1"></div><div class="r r2"></div><div class="r r3"></div>
      <span class="off-spark" style="top:96px;left:22px;"><svg viewBox="0 0 24 24"><path d="M12 2l2 8 8 2-8 2-2 8-2-8-8-2 8-2z"/></svg></span>
      <span class="off-spark" style="top:72px;right:30px;"><svg viewBox="0 0 24 24"><path d="M12 2l2 8 8 2-8 2-2 8-2-8-8-2 8-2z"/></svg></span>
      <span class="off-spark" style="bottom:40px;left:66px;"><svg viewBox="0 0 24 24"><path d="M12 2l2 8 8 2-8 2-2 8-2-8-8-2 8-2z"/></svg></span>
      <span class="off-dot" style="top:38px;left:140px;"></span>
      <span class="off-dot" style="bottom:46px;right:96px;"></span>
      <span class="off-sq" style="top:140px;right:24px;"></span>
      <span class="off-sq" style="bottom:72px;right:40px;"></span>
      <div class="off-disc"><svg viewBox="0 0 24 24"><path d="M12 13v8M9 21h6"/><circle cx="12" cy="11" r="1.6" fill="#fff"/><path d="M8.5 7.5a5 5 0 000 7M15.5 7.5a5 5 0 010 7M5.6 4.6a9 9 0 000 12.8M18.4 4.6a9 9 0 010 12.8"/></svg></div>
    </div>
    <h2>Whoops!</h2>
    <p>No internet connection found. Check your connection or try again.</p>
    <button class="btn primary-glow" id="offline-retry">Try again</button>
  </div>
</div>
<div id="sync-dot" title="Connecting…"></div>
<div class="phone">
  <header class="appbar">
    <div class="appbar-row">
      <div class="appbar-loc">
        <div class="brand-mark">
          <img id="brand-logo" alt="AIC Arusha Choir logo" style="width:70%;height:70%;object-fit:contain;">
        </div>
        <div style="min-width:0;">
          <div class="name">AIC Arusha Choir</div>
          <div class="sub" id="header-sub">—</div>
        </div>
      </div>
      <div class="header-icons">
        <div class="icon-btn" id="chat-btn" title="Choir chat">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 01-11.6 7.1L4 20.5l1.4-4.9A8 8 0 1121 12z"/></svg>
          <span class="chat-badge" id="chat-badge" style="display:none;">0</span>
        </div>
        <div class="icon-btn" id="profile-btn" title="Switch member">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
        </div>
        <div class="icon-btn" id="theme-toggle" title="Light / dark">
          <svg class="ic-sun" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="ic-moon" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
        </div>
        <div class="icon-btn" id="notif-toggle" title="Notifications">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 00-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
          <span class="dot"></span>
        </div>
      </div>

function voiceLabel(m){ if(!m || !m.voicePart) return ''; return m.voicePart === 'Musician' ? (m.instrument ? 'Musician · ' + m.instrument : 'Musician') : m.voicePart; }
function voiceOptions(cur){ return '<option value="">Select</option>' + VOICE_PARTS.map(v=>`<option value="${v}" ${v===cur?'selected':''}>${v === 'Musician' ? 'Musician (instrument)' : v}</option>`).join(''); }
function instrumentRow(prefix, m){
  const show = m && m.voicePart === 'Musician';
  return `<div class="field" id="${prefix}-instr-row" style="${show ? '' : 'display:none;'}"><label>Instrument</label><div class="field-box"><select id="${prefix}-instrument"><option value="">Select</option>${INSTRUMENTS.map(i=>`<option ${m && m.instrument===i ? 'selected' : ''}>${i}</option>`).join('')}</select></div></div>`;
}

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function genCode(){
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let c = "";
  for(let i=0;i<6;i++) c += chars[Math.floor(Math.random()*chars.length)];
  return c;
}

const APP_VERSION = 6;   // bump when releasing; older copies of the app are blocked from saving
const COLLECTIONS = ['schedule','members','sessions','announcements','songs','events'];
function mergeSharedDefaults(d){
  const out = { schedule:[], members:[], sessions:[], announcements:[], songs:[], events:[], adminPasscode:null, removed:{}, ...d };
  if(!out.removed || typeof out.removed !== 'object') out.removed = {};
  return purgeRemoved(out);
}
/* Anything deleted is remembered in data.removed, so it can never be brought back by another phone. */
function purgeRemoved(d){
  const r = d.removed || {};
  COLLECTIONS.forEach(k=>{ if(Array.isArray(d[k])) d[k] = d[k].filter(x=>!(x && x.id && r[x.id])); });
  return d;
}
function recordRemovals(base, local){
  local.removed = { ...(base.removed||{}), ...(local.removed||{}) };
  const now = Date.now();
  COLLECTIONS.forEach(k=>{
    const keep = new Set((local[k]||[]).map(x=>x && x.id));
    (base[k]||[]).forEach(x=>{ if(x && x.id && !keep.has(x.id)) local.removed[x.id] = now; });
  });
  return local;
}

function clone(o){ return JSON.parse(JSON.stringify(o === undefined ? null : o)); }
function same(a,b){ return JSON.stringify(a) === JSON.stringify(b); }
function isObj(v){ return v && typeof v === 'object' && !Array.isArray(v); }
function idArray(a){ return Array.isArray(a) && a.every(x=>isObj(x) && x.id != null); }

/* Three-way merge: apply what THIS device changed (base → local) on top of the latest server copy,
   so two phones checking in or editing at the same moment don't overwrite each other. */
function isAttendanceRec(v){ return isObj(v) && typeof v.status === 'string' && ('time' in v); }
function merge3(base, local, remote){
  if(same(local, base)) return clone(remote);
  if(same(remote, base) || remote === undefined) return clone(local);
  // attendance: a real check-in / leader mark always wins over an automatic "absent"
  if(isAttendanceRec(local) && isAttendanceRec(remote)){
    if(local.auto && !remote.auto) return clone(remote);
    if(remote.auto && !local.auto) return clone(local);
  }
  if(isObj(local) && isObj(remote)){
    const b = isObj(base) ? base : {}, out = {};
    const keys = new Set([...Object.keys(b), ...Object.keys(local), ...Object.keys(remote)]);
    keys.forEach(k=>{
      const inL = k in local, inR = k in remote, inB = k in b;
      if(!inL && inB){ if(!inR || same(remote[k], b[k])) return; out[k] = clone(remote[k]); return; } // deleted here
      if(!inR && inB){ if(same(local[k], b[k])) return; out[k] = clone(local[k]); return; }            // deleted elsewhere
      if(!inL){ out[k] = clone(remote[k]); return; }
      if(!inR){ out[k] = clone(local[k]); return; }
      out[k] = merge3(inB ? b[k] : undefined, local[k], remote[k]);
    });
    return out;
  }
  if(idArray(local) && idArray(remote)){
    const b = idArray(base) ? base : [];
    const bm = new Map(b.map(x=>[x.id,x])), lm = new Map(local.map(x=>[x.id,x])), rm = new Map(remote.map(x=>[x.id,x]));
    const localReordered = !same(local.map(x=>x.id).filter(id=>bm.has(id)), b.map(x=>x.id).filter(id=>lm.has(id)));
    const order = localReordered
      ? [...local.map(x=>x.id), ...remote.map(x=>x.id).filter(id=>!lm.has(id))]
      : [...remote.map(x=>x.id), ...local.map(x=>x.id).filter(id=>!rm.has(id))];
    const out = [];
    order.forEach(id=>{
      const inL = lm.has(id), inR = rm.has(id), inB = bm.has(id);
      let v;
      if(!inL && inB){ if(!inR || same(rm.get(id), bm.get(id))) return; v = rm.get(id); }
      else if(!inR && inB){ if(same(lm.get(id), bm.get(id))) return; v = lm.get(id); }
      else if(!inL) v = rm.get(id);
      else if(!inR) v = lm.get(id);
      else v = merge3(inB ? bm.get(id) : undefined, lm.get(id), rm.get(id));
      out.push(clone(v));
    });
    return out;
  }
  return clone(local); // both changed the same simple value: this device wins
}

function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ if(v==null) localStorage.removeItem(k); else localStorage.setItem(k,v); }catch(e){} }

function setSyncStatus(state){
  const el = document.getElementById('sync-dot'); if(!el) return;
  el.dataset.state = state;
  el.title = state === 'live' ? 'Live — synced' : state === 'saving' ? 'Saving…' : 'Offline — changes will sync when back online';
}

async function detectBackend(){
  try{
    if(!window.firebase || FIREBASE_CONFIG.apiKey.startsWith('PASTE')){ BACKEND = 'none'; return; }
    if(!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    fsDb = firebase.firestore();
    try{ await fsDb.enablePersistence({ synchronizeTabs:true }); }catch(e){ /* offline cache not available — fine */ }
    try{ const cred = await firebase.auth().signInAnonymously(); fsUid = cred && cred.user ? cred.user.uid : null; }catch(e){ console.warn('Anonymous sign-in failed (enable it in Firebase Auth):', e); }
    sharedRef = fsDb.doc(SHARED_DOC_PATH);
    BACKEND = 'firebase';
  }catch(e){ console.error('Firebase init failed', e); BACKEND = 'none'; }
}

function isEditingField(){
  const a = document.activeElement;
  return !!(a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.tagName === 'SELECT' || a.isContentEditable));
}
document.addEventListener('focusout', ()=>{
  setTimeout(()=>{ if(pendingRemoteRender && !isEditingField()){ pendingRemoteRender = false; render(true); } }, 50);
});

function applyRemote(remote){
  if(remote && remote.appVersion > APP_VERSION) showUpdateBanner();
  remote = mergeSharedDefaults(remote || {});
  // keep any edits this device hasn't finished saving yet
  const next = baseData ? merge3(baseData, data, remote) : remote;
  baseData = clone(remote);
  if(same(next, data)) return;
  data = mergeSharedDefaults(next);
  resolveLoggedInMember();
  resolveBoundMember();
  if(isEditingField() || (currentTab === 'songs' && songViewId) || currentTab === 'chat') pendingRemoteRender = true; else render(true);
  setTimeout(checkNotifications, 300);
}

function subscribeSharedData(){
  if(BACKEND !== 'firebase' || unsubscribeShared) return;
  unsubscribeShared = sharedRef.onSnapshot({ includeMetadataChanges:true }, (snap)=>{
    setSyncStatus(snap.metadata.fromCache ? 'offline' : 'live');
    if(snap.metadata.hasPendingWrites) return;
    if(snap.exists) applyRemote(snap.data());
  }, (err)=>{ console.error('Live sync error', err); setSyncStatus('offline'); showToast('Live sync stopped — check Firestore rules.'); });
}

async function loadData(){
  await detectBackend();
  notifOn = lsGet(NOTIF_KEY) !== 'off';
  currentUserId = lsGet(USER_KEY);
  boundMemberId = lsGet(BOUND_KEY);
  memberView = lsGet(MEMBER_VIEW_KEY) === '1';

  if(BACKEND === 'firebase'){
    try{
      const snap = await sharedRef.get();
      if(snap.exists){ const raw = snap.data(); if(raw.appVersion > APP_VERSION) showUpdateBanner(); data = mergeSharedDefaults(raw); }
      baseData = clone(data);
    }catch(e){ console.error('Failed to load shared data', e); }
    subscribeSharedData();
  }

  resolveLoggedInMember();
  resolveBoundMember();
  updateNotifIcon();
  render();
  if(BACKEND === 'firebase'){ initPrivateData(); startCommunity(); setTimeout(sessionTick, 1500); }
}

async function reloadSharedData(){
  if(BACKEND !== 'firebase') return;
  try{
    const snap = await sharedRef.get({ source:'server' });
    if(snap.exists) applyRemote(snap.data());
  }catch(e){ /* offline — the live listener will catch up */ }
}

function saveData(){
  if(BACKEND !== 'firebase') return Promise.resolve();
  const base = clone(baseData || {});
  const local = recordRemovals(base, clone(data));
  data.removed = clone(local.removed);
  setSyncStatus('saving');
  saveChain = saveChain.then(async ()=>{
    try{
      let merged;
      await fsDb.runTransaction(async (tx)=>{
        const snap = await tx.get(sharedRef);
        const remote = snap.exists ? mergeSharedDefaults(snap.data()) : mergeSharedDefaults({});
        if(remote.appVersion > APP_VERSION){ throw Object.assign(new Error('outdated'), {code:'outdated'}); }
        merged = mergeSharedDefaults(merge3(base, local, remote));
        finalizeSessions(merged);
        guardAgainstWipe(remote, merged);
        merged.appVersion = APP_VERSION;
        tx.set(sharedRef, merged);
      });
      baseData = clone(merged);
      if(!same(merged, data) && same(local, data)){ data = merged; resolveLoggedInMember(); if(!isEditingField()) render(true); }
      setSyncStatus('live');
    }catch(e){
      console.error('Failed to save data', e);
      setSyncStatus('offline');
      if(e && e.code === 'wipe-guard'){
        showToast('A change that would have removed lots of data was blocked. Refreshing…');
        try{ const snap = await sharedRef.get({ source:'server' }); if(snap.exists){ data = mergeSharedDefaults(snap.data()); baseData = clone(data); resolveLoggedInMember(); render(true); setSyncStatus('live'); } }catch(e2){}
      }
      else if(e && (e.code === 'outdated' || e.code === 'permission-denied')){ showUpdateBanner(); showToast('This copy of the app is out of date — tap Update.'); }
      else showToast('Could not save — check your internet connection.');
    }
  });
  return saveChain;
}

async function hashPin(memberId, pin){
  const text = 'aic-choir:' + memberId + ':' + pin;
  try{
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }catch(e){
    let h = 5381; for(let i=0;i<text.length;i++){ h = ((h<<5)+h) ^ text.charCodeAt(i); }
    return 'f' + (h>>>0).toString(16);
  }
}

function fmtDateShort(d){ const dt = new Date(d + "T00:00:00"); return dt.toLocaleDateString('en-US', { day:'numeric', month:'short' }); }
function todayStr(){ const d=new Date(), z=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate()); }
function nowTime(){ return new Date().toTimeString().slice(0,5); }

function nextOccurrence(dayName){
  const idx = DAYS.indexOf(dayName);
  const now = new Date();
  const curIdx = (now.getDay() + 6) % 7;
  let diff = (idx - curIdx + 7) % 7;
  const d = new Date(now);
  d.setDate(now.getDate() + diff);
  const z=n=>String(n).padStart(2,'0');
  return { date: d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate()), daysAway: diff };
}
function scheduleNextInfo(ev){
  if(ev.date){
    const diff = Math.round((new Date(ev.date + 'T00:00:00') - new Date(todayStr() + 'T00:00:00')) / 86400000);
    return { date: ev.date, daysAway: diff };
  }
  return nextOccurrence(ev.day);
}
function weekdayOf(dateStr){
  return DAYS[(new Date(dateStr + 'T00:00:00').getDay() + 6) % 7];

document.addEventListener('pointermove', (e)=>{
  if(!dragState) return;
  const container = document.getElementById(`song-list-${dragState.eventId}`);
  if(!container) return;
  const rows = Array.from(container.querySelectorAll('.roll-row'));
  const newIndex = rows.filter(r=>{
    const rect = r.getBoundingClientRect();
    return (rect.top + rect.height/2) < e.clientY;
  }).length;
  const clamped = Math.max(0, Math.min(newIndex, rows.length-1));
  if(clamped !== dragState.fromIndex){
    const ev = data.events.find(x=>x.id===dragState.eventId);
    if(!ev) return;
    const [moved] = ev.songs.splice(dragState.fromIndex, 1);
    ev.songs.splice(clamped, 0, moved);
    if(eventSections(ev).length){ const nb = ev.songs[clamped-1] || ev.songs[clamped+1]; if(nb) moved.section = nb.section || ''; }
    dragState.fromIndex = clamped;
    render(true);
    const row = document.querySelector(`[data-song-row="${dragState.eventId}:${dragState.songId}"]`);
    if(row) row.classList.add('dragging-row');
  }
});

    paintContent(wrap);

  const dir = pendingNavDir;
  pendingNavDir = null;
  const outClass = dir === 'fwd' ? 'slide-fwd-out' : dir === 'back' ? 'slide-back-out' : 'fade-out';
  const inClass = dir === 'fwd' ? 'slide-fwd-in' : dir === 'back' ? 'slide-back-in' : null;

  wrap.classList.add(outClass);
  setTimeout(()=>{
    paintContent(wrap);
    wrap.classList.remove('fade-out','slide-fwd-out','slide-back-out');
    if(inClass){
      wrap.classList.add(inClass);
      requestAnimationFrame(()=>{

      });

  }, 150);
}

async function completeLogin(member){
  // one account per phone, one phone per account (administrators are exempt)
  if(member.role !== 'admin'){
    const myDevice = getDeviceId();
    if(deviceIsLocked() && boundMember.id !== member.id){
      authError = `This phone is registered to ${boundMember.name}. Each phone can only be used by one member.`; authRerender(); return false;
    }
    if(member.deviceId && member.deviceId !== myDevice){
      authError = 'This account is already registered on another phone. Ask an administrator to reset your login.'; authRerender(); return false;
    }
    member.deviceId = myDevice;
  }
  member.lastLoginAt = new Date().toISOString();
  saveData();
  await setCurrentUser(member.id);
  refreshPrivateAccess();
  setTimeout(sessionTick, 800);
  await lockDeviceTo(member);
  authError = ''; loginAltMode = false; loginView = 'welcome'; currentTab = 'home';
  render();
  return true;
}

    btn.onclick = ()=>{ const inp = document.getElementById(btn.dataset.eye); if(inp) inp.type = inp.type === 'password' ? 'text' : 'password'; };
  });
  document.querySelectorAll('input[inputmode=numeric]').forEach(inp=>{
    inp.addEventListener('input', ()=>{ inp.value = inp.value.replace(/\D/g,'').slice(0,6); });
  });
  [['si-name','si-name-ok'],['su-name','su-name-ok']].forEach(([i,o])=>{
    const inp = document.getElementById(i), ok = document.getElementById(o);
    if(inp && ok) inp.addEventListener('input', ()=>{ ok.style.display = inp.value.trim().split(/\s+/).length >= 2 ? 'flex' : 'none'; });
  });

  const roleBtnMember = document.getElementById('role-btn-member');
  const roleBtnAdmin = document.getElementById('role-btn-admin');
  if(roleBtnMember && roleBtnAdmin){
    const setRole = (r)=>{
      roleBtnMember.classList.toggle('active', r==='member');
      roleBtnAdmin.classList.toggle('active', r==='admin');
      document.getElementById('passcode-row').style.display = r==='admin' ? 'block' : 'none';
      document.getElementById('su-role-selected').value = r;
    };
    roleBtnMember.onclick = ()=> setRole('member');
    roleBtnAdmin.onclick = ()=> setRole('admin');
  }

  const submitSignin = document.getElementById('submit-signin');
  if(submitSignin) submitSignin.onclick = async ()=>{
    const locked = deviceIsLocked() && !loginAltMode;
    const pin = (document.getElementById('si-pin').value || '').trim();
    const name = locked ? boundMember.name : (document.getElementById('si-name').value || '');
    if(!locked && !normName(name)){ authError = 'Please enter your full name.'; authRerender(); return; }
    if(!/^\d{4,6}$/.test(pin)){ authError = 'Your PIN must be 4 to 6 digits.'; authRerender(); return; }
    if(!isConnected()){ authError = "Can't reach the choir database. Check your internet connection."; authRerender(); return; }
    await reloadSharedData();
    const candidates = locked ? [boundMember] : data.members.filter(m=>normName(m.name) === normName(name));
    if(!candidates.length){ authError = "We couldn't find that name. Check the spelling, or tap Sign up to join."; authRerender(); return; }
    let match = null;
    for(const m of candidates){ if(m.pinHash && m.pinHash === await hashPin(m.id, pin)){ match = m; break; } }
    if(!match){
      const fresh = candidates.find(m=>!m.pinHash);
      if(fresh){ fresh.pinHash = await hashPin(fresh.id, pin); match = fresh; }
    }
    if(!match){ authError = 'Incorrect PIN. Please try again, or ask an administrator to reset it.'; authRerender(); return; }
    await completeLogin(match);
  };

  const submitSignup = document.getElementById('submit-signup');
  if(submitSignup) submitSignup.onclick = async ()=>{
    const name = document.getElementById('su-name').value.trim().replace(/\s+/g,' ');
    const role = document.getElementById('su-role-selected').value;
    const pin = (document.getElementById('su-pin').value || '').trim();
    const fail = (msg)=>{ authError = msg; authRerender(); window.scrollTo(0,0); };
    if(!name){ return fail('Please enter your full name.'); }
    if(!/^\d{4,6}$/.test(pin)){ return fail('Please create a PIN of 4 to 6 digits.'); }
    if(!isConnected()){ return fail("Can't reach the choir database. Check your internet connection."); }
    await reloadSharedData();
    if(data.members.some(m=>normName(m.name) === normName(name))){ return fail('Someone with this name is already registered. If that is you, go to Sign in.'); }
    if(role !== 'admin' && deviceIsLocked()){ return fail(`This phone is already registered to ${boundMember.name}. Each phone can only be used by one member.`); }
    if(role === 'admin'){
      const noAdminYet = !data.members.some(m=>m.role==='admin');
      const pass = document.getElementById('su-passcode').value.trim();
      if(pass.length < 4){ return fail(noAdminYet ? 'Please create an admin passcode with at least 4 characters.' : 'Please enter the admin passcode.'); }
      let ok = await claimAdmin(pass);
      if(!ok && (noAdminYet || (data.adminPasscode && pass === data.adminPasscode))){
        if(await createAdminSecret(pass)) ok = await claimAdmin(pass);
      }
      if(!ok) return fail('Incorrect admin passcode. Try again, or join as a Choir Member.');
    }
    const position = document.getElementById('su-position').value;
    const newMember = {
      id: uid(), name,
      gender: document.getElementById('su-gender').value,
      voicePart: document.getElementById('su-voice').value,
      instrument: document.getElementById('su-voice').value === 'Musician' ? document.getElementById('su-instrument').value : '',
      position, role, isLeader: position !== 'Choir Member',
      joinedAt: new Date().toISOString()
    };
    newMember.pinHash = await hashPin(newMember.id, pin);
    data.members.push(newMember);
    await completeLogin(newMember);
  };
}

function renderRatiba(){
  const today = todayStr();
  const weekly = data.schedule.filter(e=>!e.date).sort((a,b)=> DAYS.indexOf(a.day)-DAYS.indexOf(b.day) || (a.time||'').localeCompare(b.time||''));
  const upcoming = data.schedule.filter(e=>e.date && e.date >= today).sort((a,b)=> (a.date+a.time).localeCompare(b.date+b.time));

    </div>` : ''}
  `;

let showAllPast = false;
/* Everything that has already happened: finished attendance sessions, plus dated items that had none. */
function pastEntries(){
  const today = todayStr();
  const out = [];
  data.sessions.forEach(s=>{
    if(s.date < today || (s.date === today && sessionState(s) === 'closed')) out.push({ kind:'session', s, date: s.date, time: s.startTime || '' });
  });
  data.schedule.forEach(ev=>{
    if(ev.date && ev.date < today && !data.sessions.some(s=>s.scheduleId===ev.id)) out.push({ kind:'item', ev, date: ev.date, time: ev.time || '' });
  });

function reportSessions(){

    const from = new Date(); from.setDate(from.getDate() - parseInt(reportPeriod,10));

function reportMembers(){
